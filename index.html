<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Estética Regenerativa — Gestão</title>
<style>
  :root{
    --bg: #f6e1da;
    --bg-elev: #efd0c6;
    --bg-card: #fdf5f2;
    --line: #e0b6a5;
    --copper: #b5703f;
    --copper-light: #7a4626;
    --rose: #c9836a;
    --cream: #4a2f22;
    --cream-dim: #8a6552;
    --ok: #3f6b38;
    --warn: #97591f;
    --bad: #9c3a28;
    --shadow: 0 8px 24px rgba(120,70,50,.16);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;}
  h1,h2,h3{font-family: Georgia, 'Times New Roman', serif; font-weight:600; letter-spacing:.3px; color:var(--cream);}
  a{color:var(--copper-light);}
  ::selection{background:var(--copper); color:#1a120c;}

  header.app{
    display:flex; align-items:center; gap:16px; padding:14px 24px;
    background:linear-gradient(180deg, var(--bg-elev), var(--bg));
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
    flex-wrap:wrap;
  }
  header.app img{width:46px; height:46px; border-radius:50%; box-shadow:var(--shadow);}
  header.app .brand{display:flex; flex-direction:column; margin-right:8px;}
  header.app .brand b{font-family:Georgia,serif; font-size:1.05rem; letter-spacing:1px;}
  header.app .brand span{font-size:.68rem; color:var(--cream-dim); letter-spacing:2px; text-transform:uppercase;}

  nav.tabs{display:flex; gap:4px; flex-wrap:wrap; margin-left:auto;}
  nav.tabs button{
    background:transparent; border:1px solid transparent; color:var(--cream-dim);
    padding:9px 14px; border-radius:999px; cursor:pointer; font-size:.85rem; transition:.15s;
  }
  nav.tabs button:hover{ color:var(--cream); border-color:var(--line);}
  nav.tabs button.active{ background:var(--copper); color:#1a120c; font-weight:600;}

  main{max-width:1200px; margin:0 auto; padding:24px 20px 80px;}
  .view{display:none; animation: fade .25s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .grid{display:grid; gap:16px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} .grid.cols-2{grid-template-columns:1fr;} }
  @media(max-width:560px){ .grid.cols-4{grid-template-columns:1fr;} .grid.cols-3{grid-template-columns:1fr;} }

  .card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 4px; font-size:.95rem; color:var(--cream-dim); font-weight:500; letter-spacing:.5px; text-transform:uppercase; font-family:inherit;}
  .card .big{font-size:1.6rem; font-weight:700; color:var(--copper-light); font-family:Georgia,serif;}
  .card .sub{font-size:.78rem; color:var(--cream-dim); margin-top:4px;}

  .section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .section-title h2{margin:0; font-size:1.4rem;}
  .section-title p{margin:2px 0 0; color:var(--cream-dim); font-size:.85rem;}

  button.btn{
    background:var(--copper); color:#1a120c; border:none; padding:10px 16px; border-radius:10px;
    font-weight:600; cursor:pointer; font-size:.85rem; transition:.15s;
  }
  button.btn:hover{background:var(--copper-light);}
  button.btn.ghost{background:transparent; border:1px solid var(--copper); color:var(--copper-light);}
  button.btn.danger{background:var(--bad); color:#1a120c;}
  button.btn.small{padding:6px 10px; font-size:.75rem;}

  table{width:100%; border-collapse:collapse; font-size:.86rem;}
  table th{text-align:left; color:var(--cream-dim); font-weight:600; padding:10px 8px; border-bottom:1px solid var(--line); font-size:.75rem; text-transform:uppercase; letter-spacing:.5px;}
  table td{padding:10px 8px; border-bottom:1px solid var(--line);}
  table tr:hover td{background:rgba(192,133,82,.06);}
  .tag{display:inline-block; padding:3px 10px; border-radius:999px; font-size:.72rem; font-weight:600;}
  .tag.ok{background:rgba(127,174,122,.18); color:var(--ok);}
  .tag.warn{background:rgba(217,162,92,.18); color:var(--warn);}
  .tag.bad{background:rgba(196,106,92,.18); color:var(--bad);}

  input, select, textarea{
    background:var(--bg-elev); border:1px solid var(--line); color:var(--cream); padding:9px 11px;
    border-radius:8px; font-size:.85rem; width:100%; font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--copper);}
  label{font-size:.72rem; color:var(--cream-dim); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}

  .modal-bg{display:none; position:fixed; inset:0; background:rgba(10,7,5,.65); z-index:50; align-items:center; justify-content:center; padding:20px;}
  .modal-bg.active{display:flex;}
  .modal{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:24px; max-width:480px; width:100%; max-height:88vh; overflow:auto; box-shadow:var(--shadow);}
  .modal h3{margin-top:0;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}

  .empty{text-align:center; padding:40px 20px; color:var(--cream-dim);}
  .empty b{color:var(--copper-light); display:block; margin-bottom:6px; font-size:1rem;}

  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .toolbar input, .toolbar select{width:auto; min-width:160px;}

  .note{background:rgba(192,133,82,.08); border:1px solid var(--line); border-left:3px solid var(--copper); padding:12px 14px; border-radius:8px; font-size:.82rem; color:var(--cream-dim); margin-bottom:16px;}
  .note b{color:var(--copper-light);}

  .badge-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .toast{position:fixed; bottom:20px; right:20px; background:var(--copper); color:#1a120c; padding:12px 18px; border-radius:10px; font-weight:600; font-size:.85rem; box-shadow:var(--shadow); z-index:100; opacity:0; transform:translateY(10px); transition:.25s;}
  .toast.show{opacity:1; transform:none;}

  .kpi-row{display:flex; gap:8px; align-items:baseline;}
  .kpi-row .delta{font-size:.75rem;}
  .delta.up{color:var(--ok);} .delta.down{color:var(--bad);}
</style>
</head>

<script>
/* ============ STORAGE HELPERS ============ */
const SHARED = true; // dados do negócio compartilhados entre quem acessa o sistema
const LS_PREFIX = 'rc_estetica_';
function hasClaudeStorage(){ return (typeof window!=='undefined') && window.storage && typeof window.storage.get==='function'; }
async function sGet(key){
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key, SHARED); return r ? JSON.parse(r.value) : null; }catch(e){ /* cai para localStorage */ }
  }
  try{ const v = localStorage.getItem(LS_PREFIX+key); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
async function sSet(key, value){
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, JSON.stringify(value), SHARED); return; }catch(e){ /* cai para localStorage */ }
  }
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); }catch(e){ console.error('storage set fail', key, e); }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function agora(){ return new Date().toISOString(); }
function fmtDataHora(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function proximoCodigo(lista,prefixo){ const nums=lista.map(x=>{const n=parseInt((x.codigo||'').replace(prefixo+'-',''));return isNaN(n)?0:n;}); const max=nums.length?Math.max(...nums):0; return prefixo+'-'+String(max+1).padStart(3,'0'); }
function brl(n){ n = Number(n)||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

/* ============ LOAD / SAVE ============ */
async function loadAll(){
  const [c,p,pr,ag,fi,co,cf,an,ev,ex,pop,forn,usu,sol] = await Promise.all([
    sGet('clientes'), sGet('produtos'), sGet('procedimentos'), sGet('agendamentos'),
    sGet('financeiro'), sGet('compras'), sGet('config'),
    sGet('anamneses'), sGet('evolucoes'), sGet('exames'), sGet('protocolos'), sGet('fornecedores'), sGet('usuarios'), sGet('solicitacoes')
  ]);
  if(!p){ // primeira vez: semear dados
    seedData();
    await saveAll();
    toast('Sistema iniciado com os dados da Raquel ✨');
  } else {
    DB.clientes = c||[]; DB.produtos = p||[]; DB.procedimentos = pr||[];
    DB.agendamentos = ag||[]; DB.financeiro = fi||[]; DB.compras = co||[]; DB.config = cf||{};
    DB.anamneses = an||[]; DB.evolucoes = ev||[]; DB.exames = ex||[]; DB.protocolos = pop||[];
    DB.fornecedores = forn||[];
    DB.usuarios = usu||[];
    DB.solicitacoes = sol||[];
    // migração: garante campos novos em produtos salvos por versões anteriores
    DB.produtos.forEach(p=>{ if(p.reservado===undefined) p.reservado=0; if(p.statusCompra===undefined) p.statusCompra=null; });
    // garante que procedimentos novos tenham protocolo correspondente
    DB.procedimentos.forEach(proc=>{
      if(!DB.protocolos.find(x=>x.procedimentoId===proc.id)){
        DB.protocolos.push({ id:uid(), procedimentoId:proc.id, titulo:`POP — ${proc.nome}`, materiais:'', cuidadosPre:'', passos:'', cuidadosPos:'', contraindicacoes:'', intervaloRecomendado:'' });
      }
    });
  }
}
async function saveAll(){
  await Promise.all([
    sSet('clientes', DB.clientes), sSet('produtos', DB.produtos), sSet('procedimentos', DB.procedimentos),
    sSet('agendamentos', DB.agendamentos), sSet('financeiro', DB.financeiro),
    sSet('compras', DB.compras), sSet('config', DB.config),
    sSet('anamneses', DB.anamneses), sSet('evolucoes', DB.evolucoes), sSet('exames', DB.exames), sSet('protocolos', DB.protocolos),
    sSet('fornecedores', DB.fornecedores), sSet('usuarios', DB.usuarios), sSet('solicitacoes', DB.solicitacoes)
  ]);
}

/* ============ RENDER ROUTER ============ */
function render(view){
  const main = document.getElementById('main');
  // trava de segurança: usuário não-admin não acessa módulos sem permissão
  const modulosControlados = ['clientes','prontuarios','prontuario','agenda','protocolos','produtos','pedidos','compras','fornecedores','financeiro','config','usuarios'];
  if(USUARIO_LOGADO && !ehAdmin() && modulosControlados.includes(view)){
    const chave = (view==='prontuario') ? 'prontuarios' : view;
    if(view==='usuarios' || !podeVer(chave)){
      main.innerHTML = `<div class="empty"><b>Acesso não autorizado</b>Você não tem permissão para este módulo. Fale com o administrador.</div>`;
      document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
      return;
    }
  }
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  if(view==='dashboard') main.innerHTML = viewDashboard();
  else if(view==='clientes') main.innerHTML = viewClientes();
  else if(view==='prontuarios') main.innerHTML = viewProntuarios();
  else if(view==='agenda') main.innerHTML = viewAgenda();
  else if(view==='protocolos') main.innerHTML = viewProtocolos();
  else if(view==='produtos') main.innerHTML = viewProdutos();
  else if(view==='pedidos') main.innerHTML = viewPedidos();
  else if(view==='compras') main.innerHTML = viewCompras();
  else if(view==='fornecedores') main.innerHTML = viewFornecedores();
  else if(view==='financeiro') main.innerHTML = viewFinanceiro();
  else if(view==='config') main.innerHTML = viewConfig();
  else if(view==='usuarios') main.innerHTML = viewUsuarios();
  else if(view==='prontuario') main.innerHTML = viewProntuario(currentClienteId);
  wireView(view);
}
function abrirProntuario(clienteId){
  currentClienteId = clienteId;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('main').innerHTML = viewProntuario(clienteId);
  wireView('prontuario');
}

/* ============ CALC HELPERS ============ */
function custoInsumosProcedimento(proc){
  return proc.insumos.reduce((s,nome)=>{
    const p = DB.produtos.find(x=>x.nome===nome);
    return s + (p? p.custoPorUso : 0);
  },0);
}
function custoSalaProcedimento(proc){
  return (DB.config.aluguelHora||40) * (proc.duracaoMin/60);
}
function margemProcedimento(proc){
  const custo = custoInsumosProcedimento(proc)+custoSalaProcedimento(proc);
  const preco = proc.precoAtual;
  return { custo, preco, margem: preco-custo, markup: custo>0 ? ((preco/custo-1)*100) : 0 };
}
function mesAtualFinanceiro(){
  const ym = todayISO().slice(0,7);
  return DB.financeiro.filter(f=>f.data.slice(0,7)===ym);
}
function totaisFinanceiro(list){
  const receita = list.filter(f=>f.tipo==='receita').reduce((s,f)=>s+Number(f.valor),0);
  const despesa = list.filter(f=>f.tipo==='despesa').reduce((s,f)=>s+Number(f.valor),0);
  return { receita, despesa, saldo:receita-despesa };
}

}

/* ---- Evolução (notas + fotos antes/depois) ---- */
function compressImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---- Exames & gráficos ---- */
function prontuarioExames(cli){
  const registros = DB.exames.filter(e=>e.clienteId===cli.id).sort((a,b)=>a.data.localeCompare(b.data));
  const indicadores = [...new Set(registros.map(r=>r.indicador))];
  return `<div class="section-title"><div></div><button class="btn" id="btnNovoExame">+ Novo registro de exame</button></div>
  ${indicadores.length? indicadores.map(ind=>{
    const pontos = registros.filter(r=>r.indicador===ind);
    return `<div class="card" style="margin-bottom:16px;"><h3>${ind}</h3>${svgLineChart(pontos)}</div>`;
  }).join('') : `<div class="empty"><b>Nenhum exame registrado</b>Registre medições (ex.: oleosidade, hidratação, elasticidade) para acompanhar a evolução em gráfico.</div>`}
  <div class="card">
    <h3>Histórico de registros</h3>
    ${registros.length? `<table><thead><tr><th>Data</th><th>Indicador</th><th>Valor</th><th></th></tr></thead><tbody>
      ${[...registros].reverse().map(r=>`<tr><td>${fmtData(r.data)}</td><td>${r.indicador}</td><td>${r.valor}</td>
        <td><button class="btn ghost small" onclick="excluirExame('${r.id}')">Excluir</button></td></tr>`).join('')}
    </tbody></table>` : ''}
  </div>`;
}
function svgLineChart(pontos){
  if(pontos.length<2){
    return `<div class="sub">${pontos.length===1? 'Apenas 1 medição registrada — adicione mais para ver o gráfico de evolução.' : ''}</div>`;
  }
  const W=560, H=180, pad=32;
  const valores = pontos.map(p=>Number(p.valor));
  const min = Math.min(...valores), max = Math.max(...valores);
  const range = (max-min)||1;
  const stepX = (W-pad*2)/(pontos.length-1);
  const coords = pontos.map((p,i)=>{
    const x = pad + i*stepX;
    const y = H-pad - ((Number(p.valor)-min)/range)*(H-pad*2);
    return [x,y];
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="var(--copper)"></circle>
    <text x="${c[0].toFixed(1)}" y="${H-8}" font-size="9" fill="var(--cream-dim)" text-anchor="middle">${fmtData(pontos[i].data).slice(0,5)}</text>
    <text x="${c[0].toFixed(1)}" y="${(c[1]-8).toFixed(1)}" font-size="9" fill="var(--cream)" text-anchor="middle">${pontos[i].valor}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"></line>
    <path d="${pathD}" fill="none" stroke="var(--copper)" stroke-width="2.5"></path>
    ${dots}
  </svg>`;
}

  document.getElementById('btnNovoExame')?.addEventListener('click', ()=>{
    openModal(`<h3>Novo registro de exame</h3>
      <div class="field"><label>Indicador</label><input id="mExInd" placeholder="Ex.: Oleosidade, Hidratação, Elasticidade"></div>
      <div class="field"><label>Valor numérico</label><input type="number" step="0.01" id="mExValor"></div>

async function salvarAgendamento(){
  const clienteId = document.getElementById('mAgCliente').value;
  const procSel = document.getElementById('mAgProc');
  if(!clienteId){ toast('Cadastre um paciente antes de agendar'); return; }
  const procedimentoId = procSel.value;
  const valor = Number(document.getElementById('mAgValor').value) || Number(procSel.selectedOptions[0].dataset.preco);
  DB.agendamentos.push({ id:uid(), clienteId, procedimentoId, data:document.getElementById('mAgData').value,
    hora:document.getElementById('mAgHora').value, status:'agendado', valor });
  // empenho: reserva os insumos necessários para este atendimento
  const proc = DB.procedimentos.find(p=>p.id===procedimentoId);
  if(proc){ proc.insumos.forEach(nome=>{ const p = DB.produtos.find(x=>x.nome===nome); if(p && p.tipo==='insumo') p.reservado = (p.reservado||0)+1; }); }
  await sSet('agendamentos', DB.agendamentos);
  await sSet('produtos', DB.produtos);
  closeModal(); render('agenda'); toast('Agendamento criado e insumos reservados em estoque');
}
async function concluirAgendamento(id){
  const ag = DB.agendamentos.find(a=>a.id===id); if(!ag) return;
  ag.status='concluido';
  const proc = DB.procedimentos.find(p=>p.id===ag.procedimentoId);
  // baixa real do estoque e libera a reserva (o insumo foi de fato consumido)
  if(proc){ proc.insumos.forEach(nome=>{ const p = DB.produtos.find(x=>x.nome===nome); if(p && p.tipo==='insumo'){ p.estoque = Math.max(0,p.estoque-1); p.reservado = Math.max(0,(p.reservado||0)-1); } }); }
  DB.financeiro.push({ id:uid(), data:todayISO(), tipo:'receita', categoria:'Atendimento', descricao:`${proc?proc.nome:'Procedimento'} — paciente atendido`, valor:ag.valor });
  await saveAll();
  render('agenda'); toast('Atendimento concluído, estoque baixado e financeiro atualizado');
}
async function excluirAgendamento(id){
  const ag = DB.agendamentos.find(a=>a.id===id); if(!ag) return;
  // se ainda não foi concluído, libera a reserva de insumos feita no agendamento
  if(ag.status==='agendado'){
    const proc = DB.procedimentos.find(p=>p.id===ag.procedimentoId);
    if(proc){ proc.insumos.forEach(nome=>{ const p = DB.produtos.find(x=>x.nome===nome); if(p && p.tipo==='insumo') p.reservado = Math.max(0,(p.reservado||0)-1); }); }
    await sSet('produtos', DB.produtos);
  }
  DB.agendamentos = DB.agendamentos.filter(a=>a.id!==id);
  await sSet('agendamentos', DB.agendamentos); render('agenda'); toast('Agendamento removido e reserva liberada');

function wireProtocolos(){
  document.getElementById('btnNovoProtocolo')?.addEventListener('click', ()=>{
    const novoId = uid();
    DB.protocolos.push({ id:novoId, procedimentoId:null, nomeProcedimento:'Novo procedimento', titulo:'POP — Novo procedimento',
      materiais:'', cuidadosPre:'', passos:'', cuidadosPos:'', contraindicacoes:'', intervaloRecomendado:'' });
    render('protocolos');
    toast('Protocolo em branco criado — preencha e salve');
  });
}
async function salvarProtocolo(formKey, procedimentoId){
  const idx = DB.protocolos.findIndex(x=> (procedimentoId? x.procedimentoId===procedimentoId : x.id===formKey) );
  const dados = {
    id: idx>=0? DB.protocolos[idx].id : formKey,
    procedimentoId: procedimentoId||null,
    nomeProcedimento: document.getElementById(`popNome-${formKey}`)? document.getElementById(`popNome-${formKey}`).value.trim() : undefined,
    titulo: document.getElementById(`popTitulo-${formKey}`).value.trim(),
    materiais: document.getElementById(`popMateriais-${formKey}`).value.trim(),
    cuidadosPre: document.getElementById(`popPre-${formKey}`).value.trim(),
    passos: document.getElementById(`popPassos-${formKey}`).value.trim(),
    cuidadosPos: document.getElementById(`popPos-${formKey}`).value.trim(),
    contraindicacoes: document.getElementById(`popContra-${formKey}`).value.trim(),
    intervaloRecomendado: document.getElementById(`popIntervalo-${formKey}`).value.trim()
  };
  if(idx>=0) DB.protocolos[idx] = dados; else DB.protocolos.push(dados);
  await sSet('protocolos', DB.protocolos);
  render('protocolos');
  toast('Protocolo salvo');
}
async function excluirProtocolo(id){
  DB.protocolos = DB.protocolos.filter(p=>p.id!==id);
  await sSet('protocolos', DB.protocolos); render('protocolos'); toast('Protocolo removido');
}

async function salvarProduto(){
  const nome = document.getElementById('mProdNome').value.trim();
  if(!nome){ toast('Informe o nome do produto'); return; }
  const codigoProd = document.getElementById('mProdCodigo')?.value.trim()||'';
  const tipoProd = document.getElementById('mProdTipo').value;
  let novoProduto;
  if(tipoProd==='equipamento'){
    const custoEq = Number(document.getElementById('mProdCustoEq')?.value)||0;
    novoProduto = { id:uid(), codigo:codigoProd, nome, tipo:'equipamento', custoTotal:custoEq, unidades:1, custoPorUso:0,
      estoque:0, estoqueMin:0, reservado:0, statusCompra:null, obs:document.getElementById('mProdObsEq')?.value.trim()||'', criadoEm:agora() };
  } else {
    const custoTotal = Number(document.getElementById('mProdCusto').value)||0;
    const unidades = Number(document.getElementById('mProdUnid').value)||1;
    novoProduto = { id:uid(), codigo:codigoProd, nome, tipo:'insumo', custoTotal, unidades,
      custoPorUso: custoTotal/unidades, estoque:Number(document.getElementById('mProdEstoque').value)||0,
      estoqueMin:Number(document.getElementById('mProdEstoqueMin').value)||1, reservado:0, statusCompra:null, criadoEm:agora() };

  await sSet('produtos', DB.produtos);
  closeModal(); render('produtos'); toast('Produto cadastrado');
}

async function salvarEdicaoProduto(id){
  const p = DB.produtos.find(x=>x.id===id); if(!p) return;
  const nome = document.getElementById('mProdNome').value.trim();
  if(!nome){ toast('Informe o nome do produto'); return; }

  p.codigo = document.getElementById('mProdCodigo').value.trim();

async function excluirProduto(id){

  DB.produtos=DB.produtos.filter(x=>x.id!==id);
  await sSet('produtos',DB.produtos);render('produtos');toast('Produto removido');
}
async function atualizarPreco(id, valor){
  const proc = DB.procedimentos.find(p=>p.id===id); if(!proc) return;
  proc.precoAtual = Number(valor)||0;

}
async function atualizarPrecoMax(id, valor){
  const proc = DB.procedimentos.find(p=>p.id===id); if(!proc) return;
  proc.precoMax = Number(valor)||proc.precoAtual;
  await sSet('procedimentos', DB.procedimentos); render('produtos'); toast('Preço máximo atualizado');
}

async function salvarPedido(){
  const cliente = DB.clientes.find(c=>c.id===document.getElementById('mPedCliente').value);
  const procNome = document.getElementById('mPedProc').value;
  const sessoes = Number(document.getElementById('mPedSessoes').value)||1;
  const valor = Number(document.getElementById('mPedValor').value)||0;
  DB.financeiro.push({ id:uid(), data:todayISO(), tipo:'receita', categoria:'Pacote',
    descricao:`${procNome} (${sessoes}x) — ${cliente?cliente.nome:'paciente avulso'}`, valor });
  // empenho: reserva insumos proporcional ao nº de sessões do pacote
  const proc = DB.procedimentos.find(p=>p.nome===procNome);
  if(proc){ proc.insumos.forEach(nome=>{ const p = DB.produtos.find(x=>x.nome===nome); if(p && p.tipo==='insumo') p.reservado = (p.reservado||0)+sessoes; }); }
  await sSet('financeiro', DB.financeiro);
  await sSet('produtos', DB.produtos);
  closeModal(); render('pedidos'); toast(`Pedido registrado e insumos reservados para ${sessoes} sessão(ões)`);
}

      ${pedidoFeito.length? pedidoFeito.map(p=>`
        <div class="card" style="margin-top:10px; box-shadow:none; border-color:var(--warn);">
          <b>${p.nome}</b>

    </div>
    <div class="card">

async function salvarCompra(){
  const item = document.getElementById('mCompItem').value.trim();
  if(!item){ toast('Informe o item'); return; }
  const qtd = Number(document.getElementById('mCompQtd').value)||1;
  const valorUnit = Number(document.getElementById('mCompValor').value)||0;
  const valorTotal = qtd*valorUnit;
  DB.compras.push({ id:uid(), data:todayISO(), item, quantidade:qtd, valorUnit, valorTotal, fornecedor:document.getElementById('mCompForn').value.trim() });
  DB.financeiro.push({ id:uid(), data:todayISO(), tipo:'despesa', categoria:'Compras', descricao:item, valor:valorTotal });
  await saveAll();
  closeModal(); render('compras'); toast('Compra registrada e lançada no financeiro');
}
async function marcarPedidoFeito(produtoId){
  const p = DB.produtos.find(x=>x.id===produtoId); if(!p) return;
  p.statusCompra = 'pedido';
  await sSet('produtos', DB.produtos);
  render('compras'); toast(`Pedido de "${p.nome}" marcado como feito`);
}
async function voltarParaComprar(produtoId){
  const p = DB.produtos.find(x=>x.id===produtoId); if(!p) return;
  p.statusCompra = null;
  await sSet('produtos', DB.produtos);

}
function abrirRecebimento(produtoId){
  const p = DB.produtos.find(x=>x.id===produtoId); if(!p) return;
  const fornecedoresOpt = DB.fornecedores.map(f=>`<option value="${f.nome}">`).join('');
  openModal(`<h3>Receber: ${p.nome}</h3>
    <div class="field"><label>Quantidade de usos recebidos</label><input type="number" id="mRecQtd" value="${p.unidades||1}"></div>

async function confirmarRecebimento(produtoId){
  const p = DB.produtos.find(x=>x.id===produtoId); if(!p) return;
  const qtd = Number(document.getElementById('mRecQtd').value)||0;
  const valor = Number(document.getElementById('mRecValor').value)||0;
  const fornecedor = document.getElementById('mRecForn').value.trim();
  p.estoque += qtd;
  p.statusCompra = null;
  DB.compras.push({ id:uid(), data:todayISO(), item:p.nome, quantidade:qtd, valorUnit: qtd? valor/qtd : 0, valorTotal:valor, fornecedor });
  DB.financeiro.push({ id:uid(), data:todayISO(), tipo:'despesa', categoria:'Compras', descricao:`Reposição — ${p.nome}`, valor });
  await saveAll();
  closeModal(); render('compras'); toast('Estoque atualizado e despesa lançada');
}

  const checks = MODULOS_DISPONIVEIS.map(m=>`

}
async function salvarNovoUsuario(){
  const nome = document.getElementById('mUsrNome').value.trim();
  const u = document.getElementById('mUsrNovo').value.trim();
  const p1 = document.getElementById('mUsrSenha1').value;
  const p2 = document.getElementById('mUsrSenha2').value;
  const erro = document.getElementById('mUsrErro');
  const modulos = Array.from(document.querySelectorAll('.modChk:checked')).map(c=>c.value);
  if(!nome || !u){ erro.textContent='Preencha nome e usuário.'; erro.style.display='block'; return; }
  if(DB.usuarios.find(x=>x.usuario.toLowerCase()===u.toLowerCase())){ erro.textContent='Esse usuário já existe.'; erro.style.display='block'; return; }
  if(!p1 || p1.length<4){ erro.textContent='A senha precisa ter pelo menos 4 caracteres.'; erro.style.display='block'; return; }
  if(p1!==p2){ erro.textContent='As senhas não coincidem.'; erro.style.display='block'; return; }
  DB.usuarios.push({ usuario:u, nome, hash: await hashText(p1), role:'user', modulos });
  await sSet('usuarios', DB.usuarios);
  closeModal(); render('usuarios'); toast(`Usuário "${nome}" cadastrado`);
}

function abrirPermissoes(usuario){
  const conta = DB.usuarios.find(u=>u.usuario===usuario); if(!conta) return;
  const checks = MODULOS_DISPONIVEIS.map(m=>`
    <label style="display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:0; font-size:.85rem; color:var(--cream); margin-bottom:6px;">
      <input type="checkbox" value="${m.id}" class="permChk" ${(conta.modulos||[]).includes(m.id)?'checked':''} style="width:auto;"> ${m.nome}
    </label>`).join('');
  openModal(`<h3>Permissões de ${conta.nome||conta.usuario}</h3>
    <div class="field"><label>Marque os módulos que este usuário pode acessar</label><div style="max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:10px;">${checks}</div></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="salvarPermissoes('${usuario}')">Salvar permissões</button></div>`);
}
async function salvarPermissoes(usuario){
  const conta = DB.usuarios.find(u=>u.usuario===usuario); if(!conta) return;
  conta.modulos = Array.from(document.querySelectorAll('.permChk:checked')).map(c=>c.value);

  openModal(`<h3>Trocar senha de ${usuario}</h3>
    <div class="field"><label>Nova senha</label><input type="password" id="mUsrSenhaNova"></div>

async function confirmarTrocaSenha(usuario){
  const p1 = document.getElementById('mUsrSenhaNova').value;
  const p2 = document.getElementById('mUsrSenhaNova2').value;
  const erro = document.getElementById('mUsrErro2');
  if(!p1 || p1.length<4){ erro.textContent='A senha precisa ter pelo menos 4 caracteres.'; erro.style.display='block'; return; }
  if(p1!==p2){ erro.textContent='As senhas não coincidem.'; erro.style.display='block'; return; }
  const conta = DB.usuarios.find(x=>x.usuario===usuario);
  if(conta){ conta.hash = await hashText(p1); await sSet('usuarios', DB.usuarios); }
  closeModal(); toast('Senha atualizada');
}
async function removerUsuario(usuario){
  if(!confirm(`Remover o acesso de "${usuario}"?`)) return;
  DB.usuarios = DB.usuarios.filter(x=>x.usuario!==usuario);
  await sSet('usuarios', DB.usuarios);
  render('usuarios'); toast('Usuário removido');
}

/* ============ WIRE VIEWS (event bindings after render) ============ */
function wireView(view){
  if(view==='clientes') wireClientes();
  else if(view==='agenda') wireAgenda();
  else if(view==='protocolos') wireProtocolos();
  else if(view==='produtos') wireProdutos();
  else if(view==='pedidos') wirePedidos();
  else if(view==='compras') wireCompras();
  else if(view==='fornecedores') wireFornecedores();
  else if(view==='financeiro') wireFinanceiro();
  else if(view==='config') wireConfig();
  else if(view==='usuarios') wireUsuarios();
  else if(view==='prontuario'){
    const cli = DB.clientes.find(c=>c.id===currentClienteId);
    if(cli){ wireEvolucao(cli); wireExames(cli); }
  }
}

/* ============ ACESSO POR USUÁRIO E SENHA (máx. 2 administradores) ============ */
async function hashText(text){
  try{
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return 'plain:'+text; } // navegador muito antigo ou contexto não-seguro — fallback simples
}
let USUARIO_LOGADO = null; // { usuario, nome, role, modulos }

function unlockSession(conta){
  USUARIO_LOGADO = conta;
  // sessão não persistida — sempre pede login ao abrir
  document.getElementById('lockScreen').remove();
}
function usuarioAtual(){ return USUARIO_LOGADO ? (USUARIO_LOGADO.nome || USUARIO_LOGADO.usuario) : ''; }
function ehAdmin(){ return USUARIO_LOGADO && USUARIO_LOGADO.role === 'admin'; }
function podeVer(modulo){
  if(!USUARIO_LOGADO) return false;
  if(USUARIO_LOGADO.role === 'admin') return true; // admin vê tudo
  return (USUARIO_LOGADO.modulos || []).includes(modulo);
}

/* ============ ACESSO POR USUÁRIO E SENHA (com permissões por módulo) ============
   1º acesso: cria o usuário administrador. Login: cada pessoa usa seu próprio usuário/senha.
   O admin cadastra os demais usuários e escolhe quais módulos cada um pode ver. */
async function setupLock(){
  let usuarios = await sGet('usuarios') || [];
  const lockTitle = document.getElementById('lockTitle');
  const lockSubtitle = document.getElementById('lockSubtitle');
  const lockFields = document.getElementById('lockFields');
  const lockError = document.getElementById('lockError');
  const lockReset = document.getElementById('lockReset');
  lockReset.innerHTML = '';

  if(usuarios.length===0){
    // primeiro acesso — cria o usuário ADMINISTRADOR
    lockTitle.textContent = 'Criar administrador';
    lockSubtitle.textContent = 'Primeiro acesso: crie o usuário administrador (você). Depois, você cadastra os demais.';
    lockFields.innerHTML = `
      <div class="field"><input type="text" id="lockNome" placeholder="Seu nome (ex.: Rafael Medeiros)"></div>
      <div class="field"><input type="text" id="lockUser" placeholder="Usuário de login (ex.: rafael)"></div>
      <div class="field"><input type="password" id="lockPass" placeholder="Crie uma senha"></div>
      <div class="field"><input type="password" id="lockPass2" placeholder="Confirme a senha"></div>`;
    document.getElementById('lockSubmit').textContent = 'Criar e entrar';
    document.getElementById('lockSubmit').onclick = async ()=>{
      const nome = document.getElementById('lockNome').value.trim();
      const user = document.getElementById('lockUser').value.trim();
      const p1 = document.getElementById('lockPass').value;
      const p2 = document.getElementById('lockPass2').value;
      if(!nome || !user){ lockError.textContent='Preencha nome e usuário.'; lockError.style.display='block'; return; }
      if(!p1 || p1.length<4){ lockError.textContent='A senha precisa ter pelo menos 4 caracteres.'; lockError.style.display='block'; return; }
      if(p1!==p2){ lockError.textContent='As senhas não coincidem.'; lockError.style.display='block'; return; }
      const admin = { usuario:user, nome, hash: await hashText(p1), role:'admin', modulos:[] };
      usuarios.push(admin);
      await sSet('usuarios', usuarios);
      unlockSession(admin);
      renderTabsForUser();
    };
    document.getElementById('lockPass2').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('lockSubmit').click(); });
  } else {
    // login normal — usuário + senha
    lockTitle.textContent = 'Acesso restrito';
    lockSubtitle.textContent = 'Digite seu usuário e senha para entrar.';
    lockFields.innerHTML = `
      <div class="field"><input type="text" id="lockUser" placeholder="Usuário" autocomplete="username"></div>
      <div class="field"><input type="password" id="lockPass" placeholder="Senha" autocomplete="current-password"></div>`;
    document.getElementById('lockSubmit').textContent = 'Entrar';
    document.getElementById('lockSubmit').onclick = async ()=>{
      const user = document.getElementById('lockUser').value.trim().toLowerCase();
      const p1 = document.getElementById('lockPass').value;
      const conta = usuarios.find(u=>u.usuario.toLowerCase()===user);
      if(conta && conta.hash && await hashText(p1)===conta.hash){ unlockSession(conta); renderTabsForUser(); }
      else { lockError.textContent='Usuário ou senha incorretos.'; lockError.style.display='block'; }
    };
    lockReset.innerHTML = '';
    document.getElementById('lockUser').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('lockPass').focus(); });
    document.getElementById('lockPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('lockSubmit').click(); });
  }
}

// mostra/oculta as abas conforme as permissões do usuário logado
function renderTabsForUser(){
  document.querySelectorAll('#tabs button[data-view]').forEach(btn=>{
    const modulo = btn.dataset.view;
    // dashboard sempre visível; usuarios só para admin
    if(modulo==='dashboard'){ btn.style.display=''; return; }
    if(modulo==='usuarios'){ btn.style.display = ehAdmin()? '' : 'none'; return; }
    btn.style.display = podeVer(modulo)? '' : 'none';
  });
}

/* ============ INIT ============ */
(async function init(){
  await setupLock();
  const userBadge = document.getElementById('userBadge');
  if(userBadge) userBadge.textContent = '';
  document.getElementById('btnSair')?.addEventListener('click', ()=>{
    // sessão não persistida
    location.reload();
  });
  renderTabsForUser();
  document.getElementById('main').innerHTML = `<div class="empty"><b>Carregando dados...</b></div>`;
  await loadAll();
  render('dashboard');
})();
</script>
