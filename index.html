<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Estética Regenerativa — Gestão</title>
<!-- [Estilos preservados conforme seu original] -->
<style>
    :root{ --bg: #f6e1da; --copper: #b5703f; --line: #e0b6a5; --bg-card: #fdf5f2; --cream: #4a2f22; }
    body{font-family:sans-serif; background:var(--bg); color:var(--cream); padding:20px;}
    .card{ background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
    .btn{ background:var(--copper); color:#fff; border:none; padding:10px 16px; border-radius:10px; cursor:pointer; }
    .toolbar{ margin-bottom: 15px; }
    input{ padding: 8px; border-radius: 8px; border: 1px solid var(--line); }
</style>
</head>
<body>
<div id="main"></div>
<script>
// --- BUSCA DINÂMICA UNIVERSAL ---
function filtrarLista(elementoId, query) {
    const termo = query.toLowerCase();
    const rows = document.querySelectorAll(`#${elementoId} tbody tr`);
    rows.forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(termo) ? "" : "none";
    });
}

// --- LÓGICA DE BAIXA AUTOMÁTICA (Automatização do Pedido) ---
async function concluirAgendamento(agendamentoId) {
    const ag = DB.agendamentos.find(a => a.id === agendamentoId);
    if (!ag || ag.status === 'concluido') return;

    ag.status = 'concluido';
    
    // Baixa automática de 1 unidade do estoque por sessão
    const proc = DB.procedimentos.find(p => p.id === ag.procedimentoId);
    if (proc) {
        proc.insumos.forEach(nome => {
            const p = DB.produtos.find(x => x.nome === nome);
            if (p && p.tipo === 'insumo') {
                p.estoque = Math.max(0, p.estoque - 1);
                p.reservado = Math.max(0, (p.reservado || 0) - 1);
            }
        });
    }
    
    // Lançamento financeiro automático
    DB.financeiro.push({ 
        id: uid(), data: todayISO(), tipo: 'receita', 
        categoria: 'Atendimento', descricao: `Sessão concluída: ${proc.nome}`, valor: ag.valor 
    });

    await saveAll();
    render('agenda');
    toast('Estoque baixado e financeiro atualizado automaticamente!');
}

// --- DASHBOARD: VISIBILIDADE DO PONTO DE EQUILÍBRIO ---
function viewDashboard() {
    const custoFixo = (DB.config.prolabore||0) + (DB.config.marketing||0) + (DB.config.contador||0) + (DB.config.parcelaCartao||0);
    return `
    <div class="card">
        <h3>Meta de Faturamento (Ponto de Equilíbrio)</h3>
        <div class="big">${brl(custoFixo)}</div>
        <p>Você precisa faturar este valor mensal para pagar seus custos fixos.</p>
    </div>`;
}

// --- RENDERIZAÇÃO DE LISTAS COM BUSCA ---
function viewProdutos() {
    return `
    <div class="toolbar"><input placeholder="🔍 Buscar produtos..." oninput="filtrarLista('tabProdutos', this.value)"></div>
    <table id="tabProdutos">
        <thead><tr><th>Nome</th><th>Estoque</th></tr></thead>
        <tbody>${DB.produtos.map(p => `<tr><td>${p.nome}</td><td>${disponivel(p)}</td></tr>`).join('')}</tbody>
    </table>`;
}

// --- INICIALIZAÇÃO ---
loadAll().then(() => render('dashboard'));
</script>
</body>
</html>
