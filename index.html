<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="version" content="20260715013120">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Estética Regenerativa — Gestão</title>
<style>
  :root{
    --bg: #f6e1da;
    --bg-elev: #efd0c6;
    --bg-card: #fdf5f2;
    --line: #e0b6a5;
    --copper: #b5703f;
    --copper-light: #7a4626;
    --rose: #c9836a;
    --cream: #4a2f22;
    --cream-dim: #8a6552;
    --ok: #3f6b38;
    --warn: #97591f;
    --bad: #9c3a28;
    --shadow: 0 8px 24px rgba(120,70,50,.16);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;}
  h1,h2,h3{font-family: Georgia, 'Times New Roman', serif; font-weight:600; letter-spacing:.3px; color:var(--cream);}
  a{color:var(--copper-light);}
  ::selection{background:var(--copper); color:#1a120c;}

  header.app{
    display:flex; align-items:center; gap:16px; padding:14px 24px;
    background:linear-gradient(180deg, var(--bg-elev), var(--bg));
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
    flex-wrap:wrap;
  }
  header.app img{width:46px; height:46px; border-radius:50%; box-shadow:var(--shadow);}
  header.app .brand{display:flex; flex-direction:column; margin-right:8px;}
  header.app .brand b{font-family:Georgia,serif; font-size:1.05rem; letter-spacing:1px;}
  header.app .brand span{font-size:.68rem; color:var(--cream-dim); letter-spacing:2px; text-transform:uppercase;}

  nav.tabs{display:flex; gap:4px; flex-wrap:wrap; margin-left:auto;}
  nav.tabs button{
    background:transparent; border:1px solid transparent; color:var(--cream-dim);
    padding:9px 14px; border-radius:999px; cursor:pointer; font-size:.85rem; transition:.15s;
  }
  nav.tabs button:hover{ color:var(--cream); border-color:var(--line);}
  nav.tabs button.active{ background:var(--copper); color:#1a120c; font-weight:600;}

  main{max-width:1200px; margin:0 auto; padding:24px 20px 80px;}
  .view{display:none; animation: fade .25s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .grid{display:grid; gap:16px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} .grid.cols-2{grid-template-columns:1fr;} }
  @media(max-width:560px){ .grid.cols-4{grid-template-columns:1fr;} .grid.cols-3{grid-template-columns:1fr;} }

  .card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 4px; font-size:.95rem; color:var(--cream-dim); font-weight:500; letter-spacing:.5px; text-transform:uppercase; font-family:inherit;}
  .card .big{font-size:1.6rem; font-weight:700; color:var(--copper-light); font-family:Georgia,serif;}
  .card .sub{font-size:.78rem; color:var(--cream-dim); margin-top:4px;}

  .section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .section-title h2{margin:0; font-size:1.4rem;}
  .section-title p{margin:2px 0 0; color:var(--cream-dim); font-size:.85rem;}

  button.btn{
    background:var(--copper); color:#1a120c; border:none; padding:10px 16px; border-radius:10px;
    font-weight:600; cursor:pointer; font-size:.85rem; transition:.15s;
  }
  button.btn:hover{background:var(--copper-light);}
  button.btn.ghost{background:transparent; border:1px solid var(--copper); color:var(--copper-light);}
  button.btn.danger{background:var(--bad); color:#1a120c;}
  button.btn.small{padding:6px 10px; font-size:.75rem;}

  table{width:100%; border-collapse:collapse; font-size:.86rem;}
  table th{text-align:left; color:var(--cream-dim); font-weight:600; padding:10px 8px; border-bottom:1px solid var(--line); font-size:.75rem; text-transform:uppercase; letter-spacing:.5px;}
  table td{padding:10px 8px; border-bottom:1px solid var(--line);}
  table tr:hover td{background:rgba(192,133,82,.06);}
  .tag{display:inline-block; padding:3px 10px; border-radius:999px; font-size:.72rem; font-weight:600;}
  .tag.ok{background:rgba(127,174,122,.18); color:var(--ok);}
  .tag.warn{background:rgba(217,162,92,.18); color:var(--warn);}
  .tag.bad{background:rgba(196,106,92,.18); color:var(--bad);}

  input, select, textarea{
    background:var(--bg-elev); border:1px solid var(--line); color:var(--cream); padding:9px 11px;
    border-radius:8px; font-size:.85rem; width:100%; font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--copper);}
  label{font-size:.72rem; color:var(--cream-dim); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}

  .modal-bg{display:none; position:fixed; inset:0; background:rgba(10,7,5,.65); z-index:50; align-items:center; justify-content:center; padding:20px;}
  .modal-bg.active{display:flex;}
  .modal{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:24px; max-width:480px; width:100%; max-height:88vh; overflow:auto; box-shadow:var(--shadow);}
  .modal h3{margin-top:0;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}

  .empty{text-align:center; padding:40px 20px; color:var(--cream-dim);}
  .empty b{color:var(--copper-light); display:block; margin-bottom:6px; font-size:1rem;}

  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .toolbar input, .toolbar select{width:auto; min-width:160px;}

  .note{background:rgba(192,133,82,.08); border:1px solid var(--line); border-left:3px solid var(--copper); padding:12px 14px; border-radius:8px; font-size:.82rem; color:var(--cream-dim); margin-bottom:16px;}
  .note b{color:var(--copper-light);}

  .badge-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .toast{position:fixed; bottom:20px; right:20px; background:var(--copper); color:#1a120c; padding:12px 18px; border-radius:10px; font-weight:600; font-size:.85rem; box-shadow:var(--shadow); z-index:100; opacity:0; transform:translateY(10px); transition:.25s;}
  .toast.show{opacity:1; transform:none;}

  .kpi-row{display:flex; gap:8px; align-items:baseline;}
  .kpi-row .delta{font-size:.75rem;}
  .delta.up{color:var(--ok);} .delta.down{color:var(--bad);}
</style>

/* ============ SUPABASE (banco compartilhado) ============ */
const SUPABASE_URL = 'https://rsnwdedbwukkucoyhfkt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1-5STkG49tYt7y9GX7ixxw_F0k_pSDH';
let supa = null;
try{
  if(window.supabase && window.supabase.createClient){
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
}catch(e){ console.error('Supabase init falhou, usando modo local', e); supa = null; }
async function temSessaoSupabase(){
  if(!supa) return false;
  try{ const { data:{ session } } = await supa.auth.getSession(); return !!session; }catch(e){ return false; }
}

/* ============ STORAGE HELPERS ============ */
const SHARED = true; // dados do negócio compartilhados entre quem acessa o sistema
const LS_PREFIX = 'rc_estetica_';
function hasClaudeStorage(){ return (typeof window!=='undefined') && window.storage && typeof window.storage.get==='function'; }
async function sGet(key){
  if(await temSessaoSupabase()){
    try{
      const { data, error } = await supa.from('app_data').select('value').eq('key', key).maybeSingle();
      if(!error) return data ? data.value : null;
    }catch(e){ /* cai para localStorage */ }
  }
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key, SHARED); return r ? JSON.parse(r.value) : null; }catch(e){ /* cai para localStorage */ }
  }
  try{ const v = localStorage.getItem(LS_PREFIX+key); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
async function sSet(key, value){
  if(await temSessaoSupabase()){
    try{
      const { error } = await supa.from('app_data').upsert({ key, value, updated_at: new Date().toISOString() });
      if(!error) return;
    }catch(e){ /* cai para localStorage */ }
  }
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, JSON.stringify(value), SHARED); return; }catch(e){ /* cai para localStorage */ }
  }
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); }catch(e){ console.error('storage set fail', key, e); }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function fmtDataHora(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function proximoCodigo(lista,prefixo){ const nums=lista.map(x=>{const n=parseInt((x.codigo||'').replace(prefixo+'-',''));return isNaN(n)?0:n;}); const max=nums.length?Math.max(...nums):0; return prefixo+'-'+String(max+1).padStart(3,'0'); }
function brl(n){ n = Number(n)||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

/* ============ LOAD / SAVE ============ */
async function loadAll(){
  const [c,p,pr,ag,fi,co,cf,an,ev,ex,pop,forn,usu,sol,pac] = await Promise.all([
    sGet('clientes'), sGet('produtos'), sGet('procedimentos'), sGet('agendamentos'),
    sGet('financeiro'), sGet('compras'), sGet('config'),
    sGet('anamneses'), sGet('evolucoes'), sGet('exames'), sGet('protocolos'), sGet('fornecedores'), sGet('usuarios'), sGet('solicitacoes'), sGet('pacotes')
  ]);
  if(!p){ // primeira vez: semear dados
    seedData();
    await saveAll();
    toast('Sistema iniciado com os dados da Raquel ✨');
  } else {
    DB.clientes = c||[]; DB.produtos = p||[]; DB.procedimentos = pr||[];
    DB.agendamentos = ag||[]; DB.financeiro = fi||[]; DB.compras = co||[]; DB.config = cf||{};
    DB.anamneses = an||[]; DB.evolucoes = ev||[]; DB.exames = ex||[]; DB.protocolos = pop||[];
    DB.fornecedores = forn||[];
    DB.usuarios = usu||[];
    DB.solicitacoes = sol||[];
    DB.pacotes = pac||[];
    // migração: garante campos novos em produtos salvos por versões anteriores
    DB.produtos.forEach(p=>{ if(p.reservado===undefined) p.reservado=0; if(p.statusCompra===undefined) p.statusCompra=null; });
    // migração: atribui código automático se não tiver
    let iIdx=1, eIdx=1;
    DB.produtos.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).forEach(p=>{
      if(!p.codigo){ p.codigo = p.tipo==='equipamento'? 'EQP-'+String(eIdx++).padStart(3,'0') : 'PRD-'+String(iIdx++).padStart(3,'0'); }
      else if(p.tipo==='equipamento' && p.codigo.startsWith('EQP')) eIdx=Math.max(eIdx, parseInt(p.codigo.replace('EQP-',''))+1);
      else if(p.tipo==='insumo' && p.codigo.startsWith('PRD')) iIdx=Math.max(iIdx, parseInt(p.codigo.replace('PRD-',''))+1);
      if(!p.criadoEm) p.criadoEm = new Date('2026-03-05').toISOString();
    });
    DB.fornecedores.forEach(f=>{ if(!f.codigo){ f.codigo='FOR-'+String(DB.fornecedores.indexOf(f)+1).padStart(3,'0'); } if(!f.criadoEm) f.criadoEm=new Date('2026-03-05').toISOString(); });
    // garante que procedimentos novos tenham protocolo correspondente
    DB.procedimentos.forEach(proc=>{
      if(!DB.protocolos.find(x=>x.procedimentoId===proc.id)){
        DB.protocolos.push({ id:uid(), procedimentoId:proc.id, titulo:`POP — ${proc.nome}`, materiais:'', cuidadosPre:'', passos:'', cuidadosPos:'', contraindicacoes:'', intervaloRecomendado:'' });
      }
    });
  }
}
async function saveAll(){
  await Promise.all([
    sSet('clientes', DB.clientes), sSet('produtos', DB.produtos), sSet('procedimentos', DB.procedimentos),
    sSet('agendamentos', DB.agendamentos), sSet('financeiro', DB.financeiro),
    sSet('compras', DB.compras), sSet('config', DB.config),
    sSet('anamneses', DB.anamneses), sSet('evolucoes', DB.evolucoes), sSet('exames', DB.exames), sSet('protocolos', DB.protocolos),
    sSet('fornecedores', DB.fornecedores), sSet('usuarios', DB.usuarios), sSet('solicitacoes', DB.solicitacoes), sSet('pacotes', DB.pacotes)
  ]);
}

/* ============ RENDER ROUTER ============ */
function render(view){
  const main = document.getElementById('main');
  // trava de segurança: usuário não-admin não acessa módulos sem permissão
  const modulosControlados = ['clientes','prontuarios','prontuario','agenda','protocolos','produtos','pedidos','compras','fornecedores','financeiro','config','usuarios'];
  if(USUARIO_LOGADO && !ehAdmin() && modulosControlados.includes(view)){
    const chave = (view==='prontuario') ? 'prontuarios' : view;
    if(view==='usuarios' || !podeVer(chave)){
      main.innerHTML = `<div class="empty"><b>Acesso não autorizado</b>Você não tem permissão para este módulo. Fale com o administrador.</div>`;
      document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
      return;
    }
  }
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  if(view==='dashboard') main.innerHTML = viewDashboard();
  else if(view==='clientes') main.innerHTML = viewClientes();
  else if(view==='agenda') main.innerHTML = viewAgenda();
  else if(view==='protocolos') main.innerHTML = viewProtocolos();
  else if(view==='produtos') main.innerHTML = viewProdutos();
  else if(view==='pedidos') main.innerHTML = viewPedidos();
  else if(view==='compras') main.innerHTML = viewCompras();
  else if(view==='fornecedores') main.innerHTML = viewFornecedores();
  else if(view==='financeiro') main.innerHTML = viewFinanceiro();
  else if(view==='config') main.innerHTML = viewConfig();
  else if(view==='usuarios') main.innerHTML = viewUsuarios();
  else if(view==='prontuario') main.innerHTML = viewProntuario(currentClienteId);
  wireView(view);
}
function abrirProntuario(clienteId){
  currentClienteId = clienteId;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('main').innerHTML = viewProntuario(clienteId);
  wireView('prontuario');
}

/* ============ CALC HELPERS ============ */
function custoInsumosProcedimento(proc){
  return proc.insumos.reduce((s,nome)=>{
    const p = DB.produtos.find(x=>x.nome===nome);
    return s + (p? p.custoPorUso : 0);
  },0);
}
function custoSalaProcedimento(proc){
  return (DB.config.aluguelHora||40) * (proc.duracaoMin/60);
}
function margemProcedimento(proc){
  const custo = custoInsumosProcedimento(proc)+custoSalaProcedimento(proc);
  const preco = proc.precoAtual;
  return { custo, preco, margem: preco-custo, markup: custo>0 ? ((preco/custo-1)*100) : 0 };
}
function mesAtualFinanceiro(){
  const ym = todayISO().slice(0,7);
  return DB.financeiro.filter(f=>f.data.slice(0,7)===ym);
}
function totaisFinanceiro(list){
  const receita = list.filter(f=>f.tipo==='receita').reduce((s,f)=>s+Number(f.valor),0);
  const despesa = list.filter(f=>f.tipo==='despesa').reduce((s,f)=>s+Number(f.valor),0);
  return { receita, despesa, saldo:receita-despesa };
}

function fmtData(iso){ const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function tagStatus(s){

  return '<span class="tag warn">Agendado</span>';
}

function filtrarPacientes(q){
  const t = q.toLowerCase();
  const filt = DB.clientes.filter(c=>(c.nome||'').toLowerCase().includes(t)||(c.telefone||'').toLowerCase().includes(t)||(c.email||'').toLowerCase().includes(t));

  if(tbody) tbody.innerHTML = filt.map(c=>`<tr><td><b>${c.nome}</b></td><td>${c.telefone||'—'}</td><td>${c.email||'—'}</td><td>${fmtData(c.criadoEm)}</td><td><button class="btn small" onclick="abrirProntuario('${c.id}')">Abrir prontuário</button><button class="btn ghost small" onclick="excluirCliente('${c.id}')">Excluir</button></td></tr>`).join('');
}

    openModal(`<h3>Novo paciente — cadastro manual</h3>
      <p class="note" style="margin-bottom:10px;">Use esta opção só quando a paciente ainda não preencheu a ficha de anamnese. Se ela já enviou o código, use "Importar da ficha" — evita digitar tudo de novo.</p>
      <div class="field"><label>Nome completo</label><input id="mCliNome"></div>
      <div class="field"><label>Telefone / WhatsApp</label><input id="mCliTel"></div>
      <div class="field"><label>E-mail</label><input id="mCliEmail"></div>
      <div class="field"><label>Observações (pele, alergias, histórico)</label><textarea id="mCliObs" rows="3"></textarea></div>
      <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="salvarCliente()">Salvar</button></div>`);
  });
  document.getElementById('btnImportarFichaCliente')?.addEventListener('click', ()=>{
    openModal(`<h3>📋 Importar da ficha de anamnese</h3>
      <p class="note" style="margin-bottom:10px;">Cole o código que a paciente enviou. O sistema cria o cadastro e preenche a ficha de anamnese automaticamente — sem precisar digitar nada.</p>
      <div class="field"><label>Código da ficha</label>
        <input id="codigoImportNovoCliente" placeholder="ANA-2026-XXXX|..." style="font-family:monospace;font-size:.82rem;">
      </div>
      <div id="previewImportCliente" style="display:none;margin-top:10px;padding:12px;background:var(--bg-elev);border-radius:8px;font-size:.85rem;"></div>
      <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="criarClienteDaFicha()">Criar paciente</button></div>`);
  });
}
async function criarClienteDaFicha(){
  const cod = document.getElementById('codigoImportNovoCliente')?.value.trim();
  if(!cod){ toast('Cole o código da ficha'); return; }
  try{
    const partes = cod.split('|');
    if(partes.length < 2) throw new Error('inválido');
    const json = decodeURIComponent(escape(atob(partes[1])));
    const d = JSON.parse(json);
    if(!d.nome){ toast('Código não contém nome do paciente'); return; }
    // Verifica se já existe paciente com esse nome+telefone
    const existente = DB.clientes.find(c=>c.nome===d.nome && c.telefone===d.tel);
    if(existente){ toast('Este paciente já está cadastrado. Abra o prontuário dele para importar a ficha.'); return; }
    // Cria o cliente
    const novoCliente = {
      id: uid(), nome: d.nome, telefone: d.tel||'', email: d.email||'',
      dataNascimento: d.dataNasc||'', cpf: d.cpf||'', profissao: d.profissao||'',
      observacoes: '', criadoEm: todayISO()
    };
    DB.clientes.push(novoCliente);
    await sSet('clientes', DB.clientes);
    // Cria a anamnese já com os dados importados
    const an = { id:uid(), clienteId:novoCliente.id, fichaImportada:d, fichaImportadaEm:agora() };
    DB.anamneses.push(an);
    await sSet('anamneses', DB.anamneses);
    closeModal();
    render('clientes');
    toast(`✅ Paciente ${d.nome} criado com ficha já importada!`);
  }catch(e){
    toast('Código inválido ou corrompido.');
  }
}
async function salvarCliente(){
  const nome = document.getElementById('mCliNome').value.trim();
  if(!nome){ toast('Informe o nome do paciente'); return; }
  DB.clientes.push({ id:uid(), nome, telefone:document.getElementById('mCliTel').value.trim(),
    email:document.getElementById('mCliEmail').value.trim(), observacoes:document.getElementById('mCliObs').value.trim(),
    criadoEm: todayISO() });
  await sSet('clientes', DB.clientes);
  closeModal(); render('clientes'); toast('Paciente cadastrado');
}
async function excluirCliente(id){
  DB.clientes = DB.clientes.filter(c=>c.id!==id);
  await sSet('clientes', DB.clientes); render('clientes'); toast('Paciente removido');
}

let prontuarioSubTab = 'dados';
function setProntuarioSub(tab){ prontuarioSubTab = tab; render('prontuario'); }

function viewProntuario(clienteId){
  const cli = DB.clientes.find(c=>c.id===clienteId);
  if(!cli){ return `<div class="empty"><b>Paciente não encontrado</b><button class="btn" onclick="render('clientes')">Voltar para pacientes</button></div>`; }
  const sub = prontuarioSubTab;
  const tabBtn = (key,label) => `<button class="btn ${sub===key?'':'ghost'} small" onclick="setProntuarioSub('${key}')">${label}</button>`;

  return `
  <div class="section-title">
    <div><h2>Prontuário — ${cli.nome}</h2><p>Cadastrado em ${fmtData(cli.criadoEm)} ${cli.telefone?'· '+cli.telefone:''}</p></div>
    <button class="btn ghost" onclick="render('clientes')">← Voltar para pacientes</button>
  </div>
  <div class="toolbar">
    ${tabBtn('anamnese','Ficha de anamnese')}
    ${tabBtn('evolucao','Evolução & fotos')}
    ${tabBtn('exames','Exames & gráficos')}
  </div>
  <div id="prontuarioContent">
    ${sub==='anamnese'? prontuarioAnamnese(cli) : sub==='evolucao'? prontuarioEvolucao(cli) : prontuarioExames(cli)}
  </div>`;
}

async function salvarDadosPaciente(id){
  const cli = DB.clientes.find(c=>c.id===id); if(!cli) return;
  cli.nome = document.getElementById('pdNome').value.trim() || cli.nome;
  cli.telefone = document.getElementById('pdTel').value.trim();
  cli.email = document.getElementById('pdEmail').value.trim();
  cli.dataNascimento = document.getElementById('pdNasc').value;
  cli.observacoes = document.getElementById('pdObs').value.trim();
  await sSet('clientes', DB.clientes);

}

/* ---- Evolução (notas + fotos antes/depois) ---- */
function compressImage(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function prontuarioEvolucao(cli){
  const lista = DB.evolucoes.filter(e=>e.clienteId===cli.id).sort((a,b)=>b.data.localeCompare(a.data));
  // Agrupar por protocolo/procedimento
  const grupos = {};
  lista.forEach(e=>{
    const key = e.protocoloId||'geral';
    if(!grupos[key]) grupos[key]=[];
    grupos[key].push(e);
  });
  const gruposHtml = Object.entries(grupos).map(([key,evs])=>{
    const prot = DB.protocolos.find(p=>p.id===key);
    const titulo = prot? prot.titulo : 'Registros gerais';
    return `<div class="card" style="margin-bottom:16px;">
      <h3 style="margin-bottom:12px;">${titulo}</h3>
      ${evs.map(e=>`
        <div style="border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <b>${fmtData(e.data)}</b>
            <div style="display:flex;gap:6px;">
              <button class="btn small" onclick="editarEvolucao('${e.id}')">Editar</button>
              <button class="btn ghost small" onclick="excluirEvolucao('${e.id}')">Excluir</button>
            </div>
          </div>
          ${e.texto? `<p style="font-size:.85rem;line-height:1.5;margin-bottom:10px;">${e.texto}</p>`:''}
          ${(e.fotos||[]).length||e.fotoAntes? `
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              ${e.fotoAntes?`<div style="text-align:center;"><div class="sub" style="font-size:.7rem;margin-bottom:4px;">📷 Antes</div><img src="${e.fotoAntes}" style="width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);"></div>`:''}
              ${(e.fotos||[]).map((f,i)=>`<div style="text-align:center;"><div class="sub" style="font-size:.7rem;margin-bottom:4px;">📷 ${fmtData(e.data)}</div><img src="${f}" style="width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);"></div>`).join('')}
              ${e.fotoDepois?`<div style="text-align:center;"><div class="sub" style="font-size:.7rem;margin-bottom:4px;">📷 Depois</div><img src="${e.fotoDepois}" style="width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);"></div>`:''}
            </div>` : ''}
        </div>`).join('')}
    </div>`;
  }).join('');
  return `<div class="section-title"><div></div><button class="btn" id="btnNovaEvolucao">+ Novo registro</button></div>
  ${lista.length? gruposHtml : `<div class="empty"><b>Nenhum registro de evolução ainda</b>Clique em "+ Novo registro" para adicionar fotos e anotações por procedimento.</div>`}`;
}

async function salvarEvolucao(clienteId){
  const filesInput = document.getElementById('mEvFotos');
  const files = filesInput? Array.from(filesInput.files) : [];
  const entry = {
    id:uid(), clienteId,
    protocoloId: document.getElementById('mEvProtocolo')?.value||'',
    data: document.getElementById('mEvData').value||todayISO(),
    texto: document.getElementById('mEvTexto').value.trim(),
    fotos: []
  };
  if(files.length){ toast('Processando fotos...'); }
  try{
    for(const f of files){
      const compressed = await compressImage(f, 600, 0.75);
      entry.fotos.push(compressed);
    }
  }catch(e){ console.error(e); }
  DB.evolucoes.push(entry);
  await sSet('evolucoes', DB.evolucoes);
  closeModal(); render('prontuario'); toast(`Evolução registrada com ${files.length} foto(s)`);
}
async function excluirEvolucao(id){
  if(!confirm('Excluir este registro de evolução?')) return;
  DB.evolucoes = DB.evolucoes.filter(e=>e.id!==id);
  await sSet('evolucoes', DB.evolucoes); render('prontuario'); toast('Registro removido');
}
function editarEvolucao(id){
  const e = DB.evolucoes.find(x=>x.id===id); if(!e) return;
  const protOpts = DB.protocolos.sort((a,b)=>(a.titulo||'').localeCompare(b.titulo||'','pt-BR'))

      <select id="mEvProtocolo"><option value="">Geral</option>${protOpts}</select>
    </div>

      <textarea id="mEvTexto" rows="3">${e.texto||''}</textarea>
    </div>

      <input type="file" accept="image/*" id="mEvFotos" multiple>

async function salvarEdicaoEvolucao(id){
  const e = DB.evolucoes.find(x=>x.id===id); if(!e) return;
  e.protocoloId = document.getElementById('mEvProtocolo')?.value||'';
  e.data = document.getElementById('mEvData').value||e.data;
  e.texto = document.getElementById('mEvTexto').value.trim();
  const files = Array.from(document.getElementById('mEvFotos')?.files||[]);
  if(files.length){ toast('Processando fotos...'); }
  try{
    for(const f of files){
      const compressed = await compressImage(f, 600, 0.75);
      if(!e.fotos) e.fotos=[];
      e.fotos.push(compressed);
    }
  }catch(err){ console.error(err); }
  await sSet('evolucoes', DB.evolucoes);
  closeModal(); render('prontuario'); toast('Registro atualizado');
}

/* ---- Exames & gráficos ---- */
function prontuarioExames(cli){
  const registros = DB.exames.filter(e=>e.clienteId===cli.id).sort((a,b)=>a.data.localeCompare(b.data));
  const indicadores = [...new Set(registros.map(r=>r.indicador))];
  return `<div class="section-title"><div></div><button class="btn" id="btnNovoExame">+ Novo registro de exame</button></div>
  ${indicadores.length? indicadores.map(ind=>{
    const pontos = registros.filter(r=>r.indicador===ind);
    return `<div class="card" style="margin-bottom:16px;"><h3>${ind}</h3>${svgLineChart(pontos)}</div>`;
  }).join('') : `<div class="empty"><b>Nenhum exame registrado</b>Registre medições (ex.: oleosidade, hidratação, elasticidade) para acompanhar a evolução em gráfico.</div>`}
  <div class="card">
    <h3>Histórico de registros</h3>
    ${registros.length? `<table><thead><tr><th>Data</th><th>Indicador</th><th>Valor</th><th></th></tr></thead><tbody>
      ${[...registros].reverse().map(r=>`<tr><td>${fmtData(r.data)}</td><td>${r.indicador}</td><td>${r.valor}</td>
        <td><button class="btn ghost small" onclick="excluirExame('${r.id}')">Excluir</button></td></tr>`).join('')}
    </tbody></table>` : ''}
  </div>`;
}
function svgLineChart(pontos){
  if(pontos.length<2){
    return `<div class="sub">${pontos.length===1? 'Apenas 1 medição registrada — adicione mais para ver o gráfico de evolução.' : ''}</div>`;
  }
  const W=560, H=180, pad=32;
  const valores = pontos.map(p=>Number(p.valor));
  const min = Math.min(...valores), max = Math.max(...valores);
  const range = (max-min)||1;
  const stepX = (W-pad*2)/(pontos.length-1);
  const coords = pontos.map((p,i)=>{
    const x = pad + i*stepX;
    const y = H-pad - ((Number(p.valor)-min)/range)*(H-pad*2);
    return [x,y];
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map((c,i)=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="var(--copper)"></circle>
    <text x="${c[0].toFixed(1)}" y="${H-8}" font-size="9" fill="var(--cream-dim)" text-anchor="middle">${fmtData(pontos[i].data).slice(0,5)}</text>
    <text x="${c[0].toFixed(1)}" y="${(c[1]-8).toFixed(1)}" font-size="9" fill="var(--cream)" text-anchor="middle">${pontos[i].valor}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"></line>
    <path d="${pathD}" fill="none" stroke="var(--copper)" stroke-width="2.5"></path>
    ${dots}
  </svg>`;
}

function wireAgenda(){
  document.getElementById('btnRelDia')?.addEventListener('click', gerarRelatorioDia);

    const protOpt = [...DB.protocolos].sort((a,b)=>(a.titulo||'').localeCompare(b.titulo||'','pt-BR')).map(p=>`<option value="${p.id}">${p.codigo||''} — ${p.titulo||p.id} · custo ${brl(calcularCustoProtocolo(p.id))}/sessão</option>`).join('') || '<option value="">Cadastre um protocolo primeiro</option>';
    openModal(`<h3>Novo agendamento</h3>

      <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="salvarAgendamento()">Agendar</button></div>`);

async function salvarAgendamento(){
  const clienteId = document.getElementById('mAgCliente').value;
  const protocoloId = document.getElementById('mAgProc').value;
  if(!clienteId){ toast('Selecione um paciente'); return; }
  if(!protocoloId){ toast('Selecione um protocolo'); return; }
  const valor = Number(document.getElementById('mAgValor').value)||0;
  const obs = document.getElementById('mAgObs')?.value.trim()||'';
  const dataAg = document.getElementById('mAgData').value;
  const horaAg = document.getElementById('mAgHora').value;
  // Verificar conflito de horário
  const conflito = DB.agendamentos.find(a=>a.data===dataAg && a.hora===horaAg && a.status==='agendado');
  if(conflito){
    const cliConf = DB.clientes.find(c=>c.id===conflito.clienteId);
    toast(`⚠️ Horário já ocupado — ${cliConf?cliConf.nome:'outro paciente'} está agendado para ${fmtData(dataAg)} às ${horaAg}`);
    return;
  }
  const ag = { id:uid(), clienteId, protocoloId, data:dataAg,
    hora:horaAg, status:'agendado', valor, obs };
  DB.agendamentos.push(ag);
  // reserva insumos do protocolo no estoque
  const protocolo = DB.protocolos.find(p=>p.id===protocoloId);
  if(protocolo && protocolo.itens){
    protocolo.itens.forEach(it=>{
      const p=DB.produtos.find(x=>x.id===it.produtoId);
      if(p&&p.tipo==='insumo'){
        const rendimento = p.unidades||1;
        p.reservado=(p.reservado||0)+(it.quantidade/rendimento);
      }
    });
    await sSet('produtos', DB.produtos);
  }
  await sSet('agendamentos', DB.agendamentos);
  closeModal(); render('agenda'); toast('Agendamento criado — insumos reservados');
}

function gerarRelatorioDia(){
  const hoje = todayISO();
  const agHoje = DB.agendamentos.filter(a=>a.data===hoje && a.status==='agendado');
  if(!agHoje.length){ toast('Nenhum agendamento para hoje'); return; }
  let relatorio = `📋 MATERIAIS PARA HOJE — ${fmtData(hoje)}\n${'═'.repeat(40)}\n`;
  const materiaisTotal = {};
  agHoje.forEach(ag=>{
    const cli = DB.clientes.find(c=>c.id===ag.clienteId);
    const prot = DB.protocolos.find(p=>p.id===ag.protocoloId);
    relatorio += `\n🕐 ${ag.hora} — ${cli?cli.nome:'Paciente'} · ${prot?prot.titulo:'Procedimento'}\n`;
    if(prot && prot.itens){
      prot.itens.forEach(it=>{
        const prod = DB.produtos.find(x=>x.id===it.produtoId);
        if(prod){
          relatorio += `   • ${prod.codigo} ${prod.nome} — ${it.quantidade} ${prod.unidadeMedida||'un'}${it.dosagem?' ('+it.dosagem+')':''}\n`;
          const key = prod.id;
          materiaisTotal[key] = { nome:prod.nome, qtd:(materiaisTotal[key]?.qtd||0)+it.quantidade, unid:prod.unidadeMedida||'un' };
        }
      });
    }
  });
  relatorio += `\n${'═'.repeat(40)}\n📦 TOTAL A SEPARAR:\n`;
  Object.values(materiaisTotal).forEach(m=>{ relatorio += `   • ${m.nome}: ${m.qtd} ${m.unid}\n`; });
  openModal(`<h3>📋 Materiais para hoje — ${fmtData(hoje)}</h3>
    <pre style="font-size:.8rem;line-height:1.7;white-space:pre-wrap;color:var(--cream)">${relatorio}</pre>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Fechar</button>
      <button class="btn" onclick="navigator.clipboard.writeText(document.querySelector('#modalBody pre').textContent).then(()=>toast('Copiado!'))">📋 Copiar</button>
    </div>`);
}
async function concluirAgendamento(id){
  const ag = DB.agendamentos.find(a=>a.id===id); if(!ag) return;
  if(!confirm('Confirmar conclusão do atendimento? Isso dará baixa no estoque e lançará a receita no financeiro.')) return;
  ag.status = 'concluido';
  ag.concluidoEm = agora();
  const protocolo = DB.protocolos.find(p=>p.id===ag.protocoloId);
  const cliente = DB.clientes.find(c=>c.id===ag.clienteId);
  // baixa real: consome do estoque e libera a reserva
  if(protocolo && protocolo.itens){
    protocolo.itens.forEach(it=>{
      const p = DB.produtos.find(x=>x.id===it.produtoId);
      if(p && p.tipo==='insumo'){
        // desconta em USOS — converte para unidades físicas quando necessário
        const rendimento = p.unidades || 1;
        const usosConsumidos = it.quantidade;
        // usosConsumidos ÷ rendimento = unidades físicas consumidas
        const unidadesFisicasConsumidas = usosConsumidos / rendimento;
        p.estoque = Math.max(0, p.estoque - unidadesFisicasConsumidas);
        // reserva também foi em usos — libera proporcionalmente
        const reservaLiberar = usosConsumidos / rendimento;
        p.reservado = Math.max(0, (p.reservado||0) - reservaLiberar);
      }
    });
    await sSet('produtos', DB.produtos);
  }
  // lança receita no financeiro
  const descricao = `${protocolo?protocolo.titulo:'Atendimento'} — ${cliente?cliente.nome:'paciente'}`;
  DB.financeiro.push({ id:uid(), data:todayISO(), tipo:'receita', categoria:'Atendimento', descricao, valor:ag.valor||0 });
  await sSet('agendamentos', DB.agendamentos);
  await sSet('financeiro', DB.financeiro);
  render('agenda'); toast('✅ Concluído — estoque atualizado e receita lançada');
}
async function excluirAgendamento(id){
  const ag = DB.agendamentos.find(a=>a.id===id); if(!ag) return;
  // se ainda não foi concluído, libera a reserva de insumos feita no agendamento
  if(ag.status==='agendado'){
    const protocolo = DB.protocolos.find(p=>p.id===ag.protocoloId);
    if(protocolo && protocolo.itens){
      protocolo.itens.forEach(it=>{ const p=DB.produtos.find(x=>x.id===it.produtoId); if(p&&p.tipo==='insumo'){ const r=p.unidades||1; p.reservado=Math.max(0,(p.reservado||0)-(it.quantidade/r)); } });
      await sSet('produtos', DB.produtos);
    }
  }
  DB.agendamentos = DB.agendamentos.filter(a=>a.id!==id);
  await sSet('agendamentos', DB.agendamentos); render('agenda'); toast('Agendamento removido e reserva liberada');
}

function viewProtocolos(){
  const lista = [...DB.protocolos].sort((a,b)=>(a.codigo||'').localeCompare(b.codigo||''));
  return `
  <div class="section-title">
    <div><h2>Protocolos</h2><p>Cada protocolo define os produtos utilizados, quantidades e o passo a passo clínico. Custo calculado automaticamente.</p></div>
    <button class="btn" id="btnNovoProtocolo">+ Novo protocolo</button>
  </div>
  <div class="toolbar">
    <input id="searchProtocolo" placeholder="Buscar por código ou nome..." oninput="filtrarProtocolos(this.value)" style="max-width:320px;">
  </div>
  <div id="listaProtocolos">
    ${renderListaProtocolos(lista)}
  </div>`;
}
function renderListaProtocolos(lista){
  if(!lista.length) return `<div class="empty"><b>Nenhum protocolo encontrado</b></div>`;
  return lista.map(pop=>{
    const itens = pop.itens||[];
    const custoTotal = itens.reduce((s,it)=>{ const p=DB.produtos.find(x=>x.id===it.produtoId); return s+(p&&p.custoPorUso? p.custoPorUso*it.quantidade : 0); },0);
    return `<div class="card" style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">
        <div>
          <b style="font-size:1rem;">${pop.codigo||'—'}</b>
          <span style="margin-left:8px; font-family:Georgia,serif; font-size:1.05rem;">${pop.titulo||'Sem título'}</span>
          <div class="sub">${fmtDataHora(pop.criadoEm)} · Duração: ${pop.duracaoMin||60} min · Custo estimado por sessão: <b>${brl(custoTotal)}</b></div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn small" onclick="abrirProtocolo('${pop.id}')">Abrir / Editar</button>
          <button class="btn ghost small" onclick="excluirProtocolo('${pop.id}')">Excluir</button>
        </div>
      </div>
      ${itens.length? `<div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;">

    <h3 style="font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;color:var(--copper-light);margin:0 0 10px;">Documentação clínica (POP)</h3>
    <div class="field"><label>Cuidados pré-procedimento</label><textarea id="popPre" rows="2">${pop.cuidadosPre||''}</textarea></div>
    <div class="field"><label>Passo a passo</label><textarea id="popPassos" rows="4" placeholder="1) Higienizar a pele&#10;2) Aplicar...">${pop.passos||''}</textarea></div>

  document.getElementById('popProdSel')?.addEventListener('keyup', function(e){

    Array.from(this.options).forEach(o=>{ o.style.display = (o.value===''||o.text.toLowerCase().includes(q))? '' : 'none'; });

async function adicionarItemProtocolo(id){
  const pop = DB.protocolos.find(x=>x.id===id); if(!pop) return;
  const sel = document.getElementById('popProdSel');
  const produtoId = sel.value;
  if(!produtoId){ toast('Selecione um produto'); return; }
  const qtd = Number(document.getElementById('popQtd').value)||1;
  const dosagem = document.getElementById('popDosagem').value.trim();
  if(!pop.itens) pop.itens=[];
  if(pop.itens.find(it=>it.produtoId===produtoId)){ toast('Produto já adicionado — remova e adicione novamente para alterar'); return; }
  pop.itens.push({ produtoId, quantidade:qtd, dosagem });
  await sSet('protocolos', DB.protocolos);
  abrirProtocolo(id);
}
async function removerItemProtocolo(id, idx){
  const pop = DB.protocolos.find(x=>x.id===id); if(!pop) return;
  pop.itens.splice(idx,1);
  await sSet('protocolos', DB.protocolos);
  abrirProtocolo(id);
}
async function salvarProtocolo(id){
  const pop = DB.protocolos.find(x=>x.id===id); if(!pop) return;
  pop.titulo = document.getElementById('popTitulo').value.trim();
  pop.duracaoMin = Number(document.getElementById('popDuracao')?.value)||60;
  pop.intervaloRecomendado = document.getElementById('popIntervalo').value.trim();
  pop.cuidadosPre = document.getElementById('popPre').value.trim();
  pop.passos = document.getElementById('popPassos').value.trim();
  pop.cuidadosPos = document.getElementById('popPos').value.trim();
  pop.contraindicacoes = document.getElementById('popContra').value.trim();
  await sSet('protocolos', DB.protocolos);
  closeModal(); render('protocolos'); toast(`Protocolo ${pop.codigo} salvo`);
}
async function excluirProtocolo(id){
  const pop = DB.protocolos.find(x=>x.id===id);
  if(!confirm(`Excluir protocolo "${pop?.titulo||pop?.codigo}"?`)) return;
  DB.protocolos = DB.protocolos.filter(x=>x.id!==id);
  await sSet('protocolos', DB.protocolos); render('protocolos'); toast('Protocolo removido');
}

async function salvarProduto(){

  const tipo = document.getElementById('mProdTipo').value;
  const codigo = document.getElementById('mProdCodigo').value.trim();
  const fornecedorId = document.getElementById('mProdFornecedor')?.value||'';
  let p;
  if(tipo==='equipamento'){
    p = { id:uid(), codigo, nome, tipo:'equipamento',
      custoTotal:Number(document.getElementById('mProdCustoEq')?.value)||0,
      unidades:1, custoPorUso:0, estoque:0, estoqueMin:0, reservado:0, statusCompra:null,
      obs:document.getElementById('mProdObsEq')?.value.trim()||'', fornecedorId, criadoEm:agora() };
  } else {
    const custoTotal = Number(document.getElementById('mProdCusto').value)||0;
    const unidades = Number(document.getElementById('mProdUnid').value)||1;
    p = { id:uid(), codigo, nome, tipo:'insumo',
      unidadeMedida:document.getElementById('mProdUnidMed')?.value.trim()||'un',
      custoTotal, unidades, custoPorUso:custoTotal/unidades,
      estoque:Number(document.getElementById('mProdEstoque').value)||0,
      estoqueMin:Number(document.getElementById('mProdEstoqueMin').value)||1,
      reservado:0, statusCompra:null, fornecedorId, criadoEm:agora() };
  }
  DB.produtos.push(p);
  await sSet('produtos', DB.produtos);
  closeModal(); render('produtos'); toast(`Produto ${codigo} cadastrado`);
}

async function salvarEdicaoProduto(id){
  const p = DB.produtos.find(x=>x.id===id); if(!p) return;
  const nome = document.getElementById('mProdNome').value.trim();
  if(!nome){ toast('Informe o nome'); return; }
  p.nome = nome;
  p.fornecedorId = document.getElementById('mProdFornecedor')?.value||'';
  if(p.tipo==='equipamento'){
    p.custoTotal = Number(document.getElementById('mProdCustoEq')?.value)||0;
    p.obs = document.getElementById('mProdObsEq')?.value.trim()||'';
  } else {
    const ct = Number(document.getElementById('mProdCusto').value)||0;
    const un = Number(document.getElementById('mProdUnid').value)||1;
    p.unidadeMedida = document.getElementById('mProdUnidMed')?.value.trim()||'un';
    p.custoTotal = ct; p.unidades = un; p.custoPorUso = ct/un;
    p.estoque = Number(document.getElementById('mProdEstoque').value)||0;
    p.estoqueMin = Number(document.getElementById('mProdEstoqueMin').value)||1;
    p.obs = document.getElementById('mProdObs')?.value.trim()||'';
  }
  await sSet('produtos', DB.produtos);
  closeModal(); render('produtos'); toast('Produto atualizado');
}

  DB.produtos=DB.produtos.filter(x=>x.id!==id);
  await sSet('produtos',DB.produtos);render('produtos');toast('Produto removido');
}

/* ============ MARGEM DE CONTRIBUIÇÃO (MC) ============ */
function calcularCustoProtocolo(protocoloId){
  const pop = DB.protocolos.find(x=>x.id===protocoloId);
  if(!pop||!pop.itens) return 0;
  return pop.itens.reduce((s,it)=>{
    const p = DB.produtos.find(x=>x.id===it.produtoId);
    return s + (p&&p.custoPorUso? p.custoPorUso*it.quantidade : 0);
  },0);
}
function calcularCustoSala(duracaoMin){
  return (DB.config.aluguelHora||40) * ((duracaoMin||60)/60);
}
function calcularCustoFixoRateado(){
  const cf = (DB.config.parcelaCartao||0)+(DB.config.marketing||0)+
    (DB.config.contador||0)+(DB.config.prolabore||0)+(DB.config.faculdadeMensal||0);
  const meta = DB.config.metaAtendimentos||20;
  return cf / meta;
}
function calcularMC(pacoteId){
  const pkg = DB.pacotes.find(x=>x.id===pacoteId); if(!pkg) return null;
  const protocolo = DB.protocolos.find(x=>x.id===protocoloId);
  const custoInsumos = calcularCustoProtocolo(protocoloId);
  const custoSala = calcularCustoSala(protocolo?.duracaoMin||60);
  const custoFixoRateado = calcularCustoFixoRateado();
  const custoVariavel = custoInsumos + custoSala;
  const custoTotal = custoVariavel + custoFixoRateado;
  const precoVenda = pkg.precoMin||0;
  const mc = precoVenda - custoVariavel;
  const lucro = precoVenda - custoTotal;
  const mcPerc = precoVenda > 0 ? (mc/precoVenda*100) : 0;
  const markup = custoTotal > 0 ? ((precoVenda/custoTotal-1)*100) : 0;
  return { custoInsumos, custoSala, custoFixoRateado, custoVariavel, custoTotal, precoVenda, mc, lucro, mcPerc, markup };
}
function renderMC(mc){
  if(!mc) return '<div class="sub">Configure o protocolo e o preço para ver a análise.</div>';
  return `
    <table style="width:100%;font-size:.82rem;">
      <tr><td style="color:var(--cream-dim);">Custo dos insumos</td><td style="text-align:right;">${brl(mc.custoInsumos)}</td></tr>
      <tr><td style="color:var(--cream-dim);">Custo de sala</td><td style="text-align:right;">${brl(mc.custoSala)}</td></tr>
      <tr style="border-top:1px solid var(--line);"><td><b>Custo variável total</b></td><td style="text-align:right;"><b>${brl(mc.custoVariavel)}</b></td></tr>
      <tr><td style="color:var(--cream-dim);">Custo fixo rateado (${DB.config.metaAtendimentos||20} atend./mês)</td><td style="text-align:right;">${brl(mc.custoFixoRateado)}</td></tr>
      <tr style="border-top:1px solid var(--line);"><td><b>Custo total por sessão</b></td><td style="text-align:right;"><b>${brl(mc.custoTotal)}</b></td></tr>
      <tr style="border-top:2px solid var(--copper);"><td><b>Preço de venda</b></td><td style="text-align:right;"><b>${brl(mc.precoVenda)}</b></td></tr>
      <tr><td style="color:${mc.mc>=0?'var(--ok)':'var(--bad)'}"><b>Margem de contribuição (MC)</b></td><td style="text-align:right;color:${mc.mc>=0?'var(--ok)':'var(--bad)'}"><b>${brl(mc.mc)} (${mc.mcPerc.toFixed(1)}%)</b></td></tr>
      <tr><td style="color:${mc.lucro>=0?'var(--ok)':'var(--bad)'}"><b>Lucro líquido</b></td><td style="text-align:right;color:${mc.lucro>=0?'var(--ok)':'var(--bad)'}"><b>${brl(mc.lucro)}</b></td></tr>
      <tr><td style="color:var(--cream-dim);">Markup sobre custo total</td><td style="text-align:right;">${mc.markup.toFixed(0)}%</td></tr>
    </table>`;
}
function precoSugeridoMC(protocoloId, duracaoMin, markupDesejado){
  const custoInsumos = calcularCustoProtocolo(protocoloId);
  const custoSala = calcularCustoSala(duracaoMin);
  const custoFixo = calcularCustoFixoRateado();
  const custoTotal = custoInsumos + custoSala + custoFixo;
  return custoTotal * (1 + (markupDesejado||100)/100);
}

async function salvarPedido(){
  const clienteEl = document.getElementById('mPedCliente');
  const itens = window._itensPedido||[];
  const valor = Number(document.getElementById('mPedValor')?.value)||0;
  const obs = document.getElementById('mPedObs')?.value.trim()||'';
  const dataAg = document.getElementById('mPedData')?.value||todayISO();
  const horaAg = document.getElementById('mPedHora')?.value||'09:00';
  const cliente = DB.clientes.find(c=>c.id===clienteEl?.value);
  if(!cliente){ toast('Selecione um paciente'); return; }
  if(!itens.length){ toast('Adicione pelo menos um procedimento'); return; }
  if(!valor){ toast('Informe o valor cobrado'); return; }

  const cod = proximoCodigo(DB.financeiro.filter(f=>f.categoria==='Pacote'),'PKG');
  const totalSessoes = itens.reduce((s,it)=>s+it.sessoes,0);
  const nomePacote = itens.map(it=>it.titulo).join(' + ');
  const descricao = `${cod} · ${nomePacote} — ${cliente.nome}${obs?' · '+obs:''}`;

  // Registra no financeiro
  DB.financeiro.push({ id:uid(), codigo:cod, data:todayISO(), tipo:'receita', categoria:'Pacote',
    descricao, valor, clienteId:cliente.id, itens: itens.map(i=>({...i})), totalSessoes });

  // Reserva insumos e cria agendamento da 1ª sessão de cada protocolo
  for(const item of itens){
    const protocolo = DB.protocolos.find(x=>x.id===item.protId);
    if(protocolo && protocolo.itens){
      protocolo.itens.forEach(it=>{
        const p = DB.produtos.find(x=>x.id===it.produtoId);
        if(p && p.tipo==='insumo'){
          // reserva em proporção de unidades físicas (usos ÷ rendimento)
          const rendimento = p.unidades || 1;
          const reservaEmUnidades = (it.quantidade * item.sessoes) / rendimento;
          p.reservado = (p.reservado||0) + reservaEmUnidades;
        }
      });
    }
    // Cria agendamento da 1ª sessão
    DB.agendamentos.push({ id:uid(), clienteId:cliente.id, protocoloId:item.protId,
      data:dataAg, hora:horaAg, status:'agendado', valor:0, obs:`${cod} — sessão 1/${item.sessoes}`, pedidoCod:cod });
  }

  await sSet('produtos', DB.produtos);
  await sSet('financeiro', DB.financeiro);
  await sSet('agendamentos', DB.agendamentos);
  window._itensPedido = [];
  closeModal(); render('pedidos');
  toast(`✅ Pedido ${cod} registrado — 1ª sessão agendada para ${fmtData(dataAg)} às ${horaAg}`);
}
async function excluirPedido(id){
  const p = DB.financeiro.find(x=>x.id===id);
  if(!confirm(`Excluir pacote "${p?.descricao}"?\n\nIsso remove o lançamento do financeiro. Os insumos reservados NÃO são devolvidos automaticamente.`)) return;
  DB.financeiro = DB.financeiro.filter(x=>x.id!==id);

  render('pedidos'); toast('Pacote excluído');
}

/* ============ ESTOQUE POR RENDIMENTO ============ */
// estoque é sempre em UNIDADES FÍSICAS
// rendimento (unidades por compra) fica em p.unidades
// usos disponíveis = unidades físicas disponíveis × rendimento por unidade
function usosDisponiveis(p){
  const unidadesFisicas = Math.max(0, p.estoque - (p.reservado||0));
  const rendimento = p.unidades || 1; // quantos usos rende 1 unidade física
  return unidadesFisicas * rendimento;
}
// Para compatibilidade com código antigo que usa disponivel()
function disponivel(p){ return usosDisponiveis(p); }

function coberturaInsumo(produto){
  const usosDisp = usosDisponiveis(produto);
  // Uso por sessão nos protocolos
  let usoPorSessao = 0;
  DB.protocolos.forEach(pop=>{
    const item = (pop.itens||[]).find(it=>it.produtoId===produto.id);
    if(item && item.quantidade > usoPorSessao) usoPorSessao = item.quantidade;
  });
  if(usoPorSessao === 0){
    // Produto não vinculado a protocolo — mostra usos em vez de sessões
    return { sessoes: usosDisp, cor: 'ok', label: `${usosDisp} usos disponíveis (não vinculado a protocolo)` };
  }
  const sessoes = Math.floor(usosDisp / usoPorSessao);
  const minSessoes = produto.estoqueMin || 5;
  let cor;
  if(sessoes >= minSessoes * 2) cor='ok';
  else if(sessoes >= minSessoes) cor='warn';
  else cor='bad';
  const unidadesFisicas = produto.estoque - (produto.reservado||0);
  return {
    sessoes, usoPorSessao, usosDisp, cor,
    label: `${sessoes} sessões · ${usosDisp} usos restantes (${unidadesFisicas} un × ${produto.unidades||1} usos/un)`
  };
}
function minutoSugerido(produto){
  return produto.estoqueMin || 5;
}

  const mesAtual = todayISO().slice(0,7);
  const mesNome = new Date().toLocaleString('pt-BR',{month:'long',year:'numeric'});
  const recMes = DB.financeiro.filter(f=>f.tipo==='receita'&&f.data&&f.data.slice(0,7)===mesAtual);
  const despMes = DB.financeiro.filter(f=>f.tipo==='despesa'&&f.data&&f.data.slice(0,7)===mesAtual);
  const recBruta = recMes.reduce((s,f)=>s+Number(f.valor),0);
  const custoServicos = recMes.reduce((s,f)=>{
    if(!f.itens) return s;
    return s + f.itens.reduce((ss,it)=>ss + (calcularCustoProtocolo(it.protId)||0)*it.sessoes + calcularCustoSala(DB.protocolos.find(p=>p.id===it.protId)?.duracaoMin||60)*it.sessoes,0);
  },0);
  const lucroBruto = recBruta - custoServicos;
  const despFixas = despMes.filter(f=>f.categoria==='Custo fixo').reduce((s,f)=>s+Number(f.valor),0);
  const despVariaveis = despMes.filter(f=>f.categoria!=='Custo fixo').reduce((s,f)=>s+Number(f.valor),0);
  const lucroOp = lucroBruto - despFixas - despVariaveis;
  const row = (label,val,destaque,indent)=>`<tr style="${destaque?'border-top:2px solid var(--copper);font-weight:700;':''}">
    <td style="padding:6px 4px;${indent?'padding-left:20px;color:var(--cream-dim)':''}">${label}</td>
    <td style="text-align:right;padding:6px 4px;color:${val<0?'var(--bad)':'inherit'}">${brl(Math.abs(val))}${val<0?' (-)':''}</td>
  </tr>`;
  return `<div class="card" style="max-width:500px;">
    <h3>DRE — ${mesNome}</h3>
    <p class="sub" style="margin-bottom:14px;">Demonstração do Resultado do Exercício</p>
    <table style="width:100%;border-collapse:collapse;">
      ${row('(+) Receita bruta de serviços', recBruta, false, false)}
      ${row('(-) Custo dos serviços (insumos + sala)', custoServicos, false, true)}
      ${row('= Lucro bruto', lucroBruto, true, false)}
      ${row('(-) Despesas fixas (cartão, contador, mktg, pró-labore)', despFixas, false, true)}
      ${row('(-) Outras despesas variáveis', despVariaveis, false, true)}
      ${row('= Resultado operacional (lucro líquido)', lucroOp, true, false)}
    </table>
    <div style="margin-top:12px;padding:10px;background:var(--bg-elev);border-radius:8px;font-size:.8rem;color:var(--cream-dim);">
      Margem líquida: <b style="color:${lucroOp>=0?'var(--ok)':'var(--bad)'}">${recBruta>0?(lucroOp/recBruta*100).toFixed(1):0}%</b> · 
      Ponto de equilíbrio: <b>${brl(despFixas+despVariaveis)}/mês</b>
    </div>
  </div>`;
}

async function anexarPdfFicha(clienteId, input){
  const file = input.files[0];
  if(!file) return;
  if(file.type !== 'application/pdf'){ toast('Selecione um arquivo PDF'); return; }
  if(file.size > 4*1024*1024){ toast('PDF muito grande (máx. 4MB). Comprima o arquivo antes de anexar.'); return; }
  toast('Salvando PDF...');
  try{
    const reader = new FileReader();
    reader.onload = async function(e){
      let an = DB.anamneses.find(x=>x.clienteId===clienteId);
      if(!an){ an={id:uid(),clienteId}; DB.anamneses.push(an); }
      an.pdfAnexado = e.target.result;
      an.pdfAnexadoEm = agora();
      await sSet('anamneses', DB.anamneses);
      render('prontuario');
      toast('✅ PDF anexado ao prontuário!');
    };
    reader.readAsDataURL(file);
  }catch(err){
    toast('Erro ao processar o PDF');
  }
}

async function importarFicha(){
  const cod = document.getElementById('codigoImport')?.value.trim();
  if(!cod){ toast('Cole o código da ficha no campo acima'); return; }
  try{
    const partes = cod.split('|');
    if(partes.length < 2) throw new Error('Código inválido');
    const b64 = partes[1];
    const json = decodeURIComponent(escape(atob(b64)));
    const d = JSON.parse(json);
    // Preenche os campos da anamnese
    const set = (id, val) => { const el=document.getElementById(id); if(el && val) el.value=val; };
    set('anDoencasCronicas', d.doencas);
    set('anCirurgias', d.cirurgias);
    set('anMedicamentos', d.medicamentos);
    set('anAlergias', d.alergias);
    set('anQueixa', d.queixa);
    set('anDoencas', d.doencasPele);
    set('anHistoricoSaude', d.obs);
    set('anRotina', d.rotinaAtivos);
    // gestante
    const gestEl = document.getElementById('anGestante');
    if(gestEl && d.gestante){
      const map = {'Não':'nao','Gestante':'sim','Amamentando':'sim','Possível':'talvez'};
      gestEl.value = map[d.gestante] || 'nao';
    }
    // tipo de pele
    const tpEl = document.getElementById('anTipoPele');
    if(tpEl && d.tipoPele) tpEl.value = d.tipoPele;
    // fototipo
    const ftEl = document.getElementById('anFototipo');
    if(ftEl && d.fototipo){
      const ft = d.fototipo.split('—')[0].trim();
      Array.from(ftEl.options).forEach(o=>{ if(o.value===ft) ftEl.value=ft; });
    }
    // termo LGPD
    const termoEl = document.getElementById('anTermo');
    if(termoEl) termoEl.value = 'sim';

    // Salva os dados completos da ficha na anamnese para gerar PDF depois
    const clienteId = window._prontuarioClienteId;
    if(clienteId){
      let an = DB.anamneses.find(x=>x.clienteId===clienteId);
      if(!an){ an={id:uid(),clienteId}; DB.anamneses.push(an); }
      an.fichaImportada = d;
      an.fichaImportadaEm = agora();
      await sSet('anamneses', DB.anamneses);
    }

    toast('✅ Ficha importada! Salve o prontuário e clique em "Ver PDF da ficha" para visualizar.');
    document.getElementById('codigoImport').value = '';
    render('prontuario');
  }catch(e){
    toast('Código inválido ou corrompido. Peça a paciente para gerar novamente.');
  }
}

function gerarPDFFicha(clienteId){
  const an = DB.anamneses.find(x=>x.clienteId===clienteId);
  const d = an?.fichaImportada;
  const cli = DB.clientes.find(x=>x.id===clienteId);
  if(!d){ toast('Nenhuma ficha importada para este paciente.'); return; }

  // Usa jsPDF igual à ficha original
  if(!window.jspdf){ toast('Aguarde o carregamento do PDF...'); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm',format:'a4'});
  const copper=[181,112,63], cream=[74,47,34], dimmed=[138,101,82], bgCard=[253,245,242];
  const W=210, M=18;
  let y=15;

  // Header
  doc.setFillColor(...bgCard);
  doc.roundedRect(M,y,W-M*2,28,3,3,'F');
  doc.setFont('times','bold'); doc.setFontSize(14); doc.setTextColor(...copper);
  doc.text('RC Estética Regenerativa', W/2, y+10, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...dimmed);
  doc.text('Ficha de Anamnese — Documento Clínico Confidencial', W/2, y+17, {align:'center'});
  doc.text('Preenchida em: '+(d.aceiteData||an.fichaImportadaEm||'—'), W/2, y+23, {align:'center'});
  y+=34;

  const sec=(t)=>{ doc.setFillColor(...copper); doc.rect(M,y,W-M*2,6,'F'); doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(255,255,255); doc.text(t.toUpperCase(),M+3,y+4); y+=9; doc.setTextColor(...cream); };
  const campo=(label,val,full)=>{
    if(!val||val==='—')val='—';
    const linhas=doc.splitTextToSize(String(val),full?W-M*2-3:(W-M*2)/2-5);
    const h=Math.max(8,linhas.length*4+4);
    if(y+h>270){doc.addPage();y=15;}
    doc.setFillColor(...bgCard); doc.roundedRect(M,y,full?W-M*2:(W-M*2)/2-2,h,1.5,1.5,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...dimmed);
    doc.text(label.toUpperCase(),M+2.5,y+3.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...cream);
    doc.text(linhas,M+2.5,y+7);
    if(!full)return h; y+=h+2;
  };
  const duplo=(a,b)=>{
    const ha=Math.max(8,doc.splitTextToSize(a[1]||'—',(W-M*2)/2-5).length*4+4);
    const hb=Math.max(8,doc.splitTextToSize(b[1]||'—',(W-M*2)/2-5).length*4+4);
    const mh=Math.max(ha,hb);
    if(y+mh>270){doc.addPage();y=15;}
    [[a,M],[b,M+(W-M*2)/2+2]].forEach(([item,x])=>{
      const v=item[1]||'—'; const linhas=doc.splitTextToSize(String(v),(W-M*2)/2-5);
      doc.setFillColor(...bgCard); doc.roundedRect(x,y,(W-M*2)/2-2,mh,1.5,1.5,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...dimmed);
      doc.text(item[0].toUpperCase(),x+2.5,y+3.5);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...cream);
      doc.text(linhas,x+2.5,y+7);
    }); y+=mh+2;
  };

  sec('Dados Pessoais');
  campo('Nome completo', d.nome||cli?.nome, true);
  duplo(['Data de nascimento', d.dataNasc||'—'], ['CPF', d.cpf||'—']);
  duplo(['Telefone', d.tel||cli?.telefone||'—'], ['E-mail', d.email||cli?.email||'—']);
  duplo(['Profissão', d.profissao||'—'], ['Como nos conheceu', d.indicacao||'—']);
  y+=3;

  sec('Saúde Geral');
  campo('Doenças crônicas', d.doencas, true);
  campo('Cirurgias recentes', d.cirurgias, true);
  campo('Medicamentos contínuos', d.medicamentos, true);
  campo('Alergias', d.alergias, true);
  campo('Gestante / amamentando', d.gestante, true);
  y+=3;

  sec('Pele e Cabelo');
  duplo(['Tipo de pele', d.tipoPele], ['Fototipo Fitzpatrick', d.fototipo]);
  campo('Queixa principal', d.queixa, true);
  campo('Doenças de pele', d.doencasPele, true);
  campo('Protetor solar', d.protetor, true);
  campo('Ativos na rotina', d.rotinaAtivos, true);
  campo('Procedimento recente', d.procRecente, true);
  campo('Histórico de queloide', d.queloide, true);
  y+=3;

  sec('Estilo de Vida');
  duplo(['Atividade física', d.atividade], ['Fuma', d.fuma]);
  campo('Estresse', d.estresse, true);
  if(d.obs) campo('Observações', d.obs, true);
  y+=3;

  // Termo
  if(y+30>270){doc.addPage();y=15;}
  sec('Consentimento — LGPD');
  doc.setFillColor(...bgCard); doc.roundedRect(M,y,W-M*2,14,1.5,1.5,'F');
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...dimmed);
  const termo='Paciente declarou que leu e concordou com o Termo de Consentimento Livre e Esclarecido, incluindo cláusulas sobre procedimentos, riscos, fotografias e LGPD (Lei 13.709/2018).';
  doc.text(doc.splitTextToSize(termo,W-M*2-6),M+3,y+5);
  y+=17;

  // Assinatura
  if(y+30>270){doc.addPage();y=15;}
  doc.setFillColor(253,240,232); doc.roundedRect(M,y,W-M*2,28,2,2,'F');
  doc.setDrawColor(...copper); doc.roundedRect(M,y,W-M*2,28,2,2,'S');
  doc.setFont('times','bolditalic'); doc.setFontSize(20); doc.setTextColor(...copper);
  doc.text(d.assinatura||d.nome||cli?.nome||'—', M+6, y+14);
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...dimmed);
  doc.text('Assinatura eletrônica — '+(d.aceiteData||'—'), M+6, y+22);
  doc.text('Validade: MP 2.200-2/2001 e Lei 14.063/2020', M+6, y+27);

  // Rodapé
  doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(...dimmed);
  doc.text('RC Estética Regenerativa · (11) 98112-6897 · rmr.biomedi@gmail.com · Documento confidencial', W/2, 290, {align:'center'});

  const nomeArq = (d.nome||cli?.nome||'paciente').replace(/\s+/g,'-');
  doc.save(`Anamnese-RC-${nomeArq}-${todayISO()}.pdf`);
  toast('✅ PDF gerado e baixado!');
}

function exportarDados(){
  const dados = {
    versao: '1.0', exportadoEm: agora(),
    clientes: DB.clientes, produtos: DB.produtos, procedimentos: DB.procedimentos,
    agendamentos: DB.agendamentos, financeiro: DB.financeiro, compras: DB.compras,
    config: DB.config, anamneses: DB.anamneses, evolucoes: DB.evolucoes,
    exames: DB.exames, protocolos: DB.protocolos, fornecedores: DB.fornecedores,
    usuarios: DB.usuarios, pacotes: DB.pacotes
  };
  const blob = new Blob([JSON.stringify(dados, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `RC-backup-${todayISO()}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('✅ Backup exportado com sucesso!');
}
async function importarDados(input){
  const file = input.files[0]; if(!file) return;
  if(!confirm('Importar este backup vai SUBSTITUIR todos os dados atuais. Tem certeza?')) return;
  try{
    const text = await file.text();
    const dados = JSON.parse(text);
    DB.clientes = dados.clientes||[];
    DB.produtos = dados.produtos||[];
    DB.procedimentos = dados.procedimentos||[];
    DB.agendamentos = dados.agendamentos||[];
    DB.financeiro = dados.financeiro||[];
    DB.compras = dados.compras||[];
    DB.config = dados.config||{};
    DB.anamneses = dados.anamneses||[];
    DB.evolucoes = dados.evolucoes||[];
    DB.exames = dados.exames||[];
    DB.protocolos = dados.protocolos||[];
    DB.fornecedores = dados.fornecedores||[];
    DB.usuarios = dados.usuarios||[];
    DB.pacotes = dados.pacotes||[];
    await saveAll();
    render('dashboard');
    toast('✅ Backup importado com sucesso!');
  }catch(e){ toast('Erro ao importar — verifique se o arquivo é válido'); }
  input.value='';
}

async function lancarCustosFixos(){
  const mes = new Date().toLocaleString('pt-BR',{month:'long',year:'numeric'});
  const jaLancado = DB.financeiro.find(f=>f.descricao&&f.descricao.includes('Custo fixo')&&f.data&&f.data.slice(0,7)===todayISO().slice(0,7));
  if(jaLancado){ toast('Custos fixos deste mês já foram lançados'); return; }
  if(!confirm(`Lançar os custos fixos de ${mes} no financeiro?

Serão criados lançamentos para: cartão, marketing, contador e pró-labore.`)) return;
  const c = DB.config;
  const data = todayISO();
  const lancamentos = [
    { desc:'Parcela cartão — equipamentos', valor:c.parcelaCartao||0 },
    { desc:'Marketing / redes sociais', valor:c.marketing||0 },
    { desc:'Contador', valor:c.contador||0 },
    { desc:'Pró-labore', valor:c.prolabore||0 },
  ].filter(l=>l.valor>0);
  lancamentos.forEach(l=>{
    DB.financeiro.push({ id:uid(), data, tipo:'despesa', categoria:'Custo fixo', descricao:`${l.desc} — ${mes}`, valor:l.valor });
  });
  await sSet('financeiro', DB.financeiro);
  const total = lancamentos.reduce((s,l)=>s+l.valor,0);
  toast(`✅ ${lancamentos.length} lançamentos criados — total R$ ${total.toFixed(2).replace('.',',')} lançado no financeiro`);
}

/* ============ WIRE VIEWS (event bindings after render) ============ */
function wireView(view){
  if(view==='clientes') wireClientes();
  else if(view==='agenda') wireAgenda();
  else if(view==='protocolos') wireProtocolos();
  else if(view==='produtos') wireProdutos();
  else if(view==='pedidos') wirePedidos();

}

/* ============ ACESSO POR USUÁRIO E SENHA (máx. 2 administradores) ============ */
async function hashText(text){
  try{
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return 'plain:'+text; } // navegador muito antigo ou contexto não-seguro — fallback simples
}
let USUARIO_LOGADO = null; // { usuario, nome, role, modulos }

function unlockSession(conta){
  USUARIO_LOGADO = conta;
  // sessão não persistida — sempre pede login ao abrir
  document.getElementById('lockScreen').remove();
}
function usuarioAtual(){ return USUARIO_LOGADO ? (USUARIO_LOGADO.nome || USUARIO_LOGADO.usuario) : ''; }
function ehAdmin(){ return USUARIO_LOGADO && USUARIO_LOGADO.role === 'admin'; }
function podeVer(modulo){
  if(!USUARIO_LOGADO) return false;
  if(USUARIO_LOGADO.role === 'admin') return true; // admin vê tudo
  return (USUARIO_LOGADO.modulos || []).includes(modulo);
}

/* ============ ACESSO POR USUÁRIO E SENHA (com permissões por módulo) ============
   1º acesso: cria o usuário administrador. Login: cada pessoa usa seu próprio usuário/senha.
   O admin cadastra os demais usuários e escolhe quais módulos cada um pode ver. */
async function garantirUsuarioAdminLocal(email){
  // garante que exista um registro local correspondente ao login do Supabase,
  // para o restante do sistema (permissões por módulo) continuar funcionando igual
  let usuarios = await sGet('usuarios') || [];
  if(!usuarios.find(u=>(u.usuario||'').toLowerCase()===email.toLowerCase())){
    usuarios.push({ usuario: email, nome: email, hash:'', role:'admin', modulos:[] });
    await sSet('usuarios', usuarios);
  }
  return usuarios.find(u=>(u.usuario||'').toLowerCase()===email.toLowerCase());
}

async function recarregarTudoPosLogin(){
  document.getElementById('main').innerHTML = `<div class="empty"><b>Carregando dados...</b></div>`;
  await loadAll();
  render('dashboard');
}

async function setupLock(){
  const lockTitle = document.getElementById('lockTitle');
  const lockSubtitle = document.getElementById('lockSubtitle');
  const lockFields = document.getElementById('lockFields');
  const lockError = document.getElementById('lockError');
  const lockReset = document.getElementById('lockReset');
  lockReset.innerHTML = '';

  // Se já existe sessão Supabase ativa (mesmo navegador logou antes), entra direto
  if(supa){
    try{
      const { data:{ session } } = await supa.auth.getSession();
      if(session){
        const conta = await garantirUsuarioAdminLocal(session.user.email);
        unlockSession(conta);
        renderTabsForUser();
        await recarregarTudoPosLogin();
        return;
      }
    }catch(e){}
  }

  lockTitle.textContent = 'Acesso restrito';
  lockSubtitle.textContent = 'Digite seu e-mail e senha para entrar.';
  lockFields.innerHTML = `
    <div class="field"><input type="email" id="lockUser" placeholder="E-mail" autocomplete="username"></div>
    <div class="field"><input type="password" id="lockPass" placeholder="Senha" autocomplete="current-password"></div>`;
  document.getElementById('lockSubmit').textContent = 'Entrar';
  document.getElementById('lockSubmit').onclick = async ()=>{
    const email = document.getElementById('lockUser').value.trim();
    const pass = document.getElementById('lockPass').value;
    lockError.style.display='none';
    if(!email || !pass){ lockError.textContent='Preencha e-mail e senha.'; lockError.style.display='block'; return; }

    if(supa){
      let resultado;
      try{
        resultado = await supa.auth.signInWithPassword({ email, password: pass });
      }catch(networkErr){
        // Supabase inacessível (sem internet, etc.) — tenta fallback local
        const usuariosLocais = JSON.parse(localStorage.getItem(LS_PREFIX+'usuarios')||'[]');
        const conta = usuariosLocais.find(u=>(u.usuario||'').toLowerCase()===email.toLowerCase());
        if(conta && conta.hash && await hashText(pass)===conta.hash){
          unlockSession(conta); renderTabsForUser(); await recarregarTudoPosLogin(); return;
        }
        lockError.textContent='Sem conexão com o servidor. Verifique sua internet.'; lockError.style.display='block'; return;
      }
      if(!resultado.error && resultado.data.session){
        const conta = await garantirUsuarioAdminLocal(resultado.data.session.user.email);
        unlockSession(conta);
        renderTabsForUser();
        await recarregarTudoPosLogin();
        return;
      }
      lockError.textContent = 'E-mail ou senha incorretos.';
      lockError.style.display='block';
      return;
    }

    // Supabase não carregou — modo local (compatibilidade)
    const usuariosLocais = JSON.parse(localStorage.getItem(LS_PREFIX+'usuarios')||'[]');
    const conta = usuariosLocais.find(u=>(u.usuario||'').toLowerCase()===email.toLowerCase());
    if(conta && conta.hash && await hashText(pass)===conta.hash){
      unlockSession(conta); renderTabsForUser(); await recarregarTudoPosLogin();
    } else {
      lockError.textContent='E-mail ou senha incorretos.'; lockError.style.display='block';
    }
  };
  document.getElementById('lockUser').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('lockPass').focus(); });
  document.getElementById('lockPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('lockSubmit').click(); });
}

// mostra/oculta as abas conforme as permissões do usuário logado
function renderTabsForUser(){
  document.querySelectorAll('#tabs button[data-view]').forEach(btn=>{
    const modulo = btn.dataset.view;
    // dashboard sempre visível; usuarios só para admin
    if(modulo==='dashboard'){ btn.style.display=''; return; }
    if(modulo==='usuarios'){ btn.style.display = ehAdmin()? '' : 'none'; return; }
    btn.style.display = podeVer(modulo)? '' : 'none';
  });
}

/* ============ ATALHOS GLOBAIS ============ */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});

/* ============ INIT ============ */
(async function init(){
  await setupLock();
  const userBadge = document.getElementById('userBadge');
  if(userBadge) userBadge.textContent = '';
  document.getElementById('btnSair')?.addEventListener('click', async ()=>{
    if(supa){ try{ await supa.auth.signOut(); }catch(e){} }
    location.reload();
  });
  // Só carrega os dados automaticamente aqui se o login já aconteceu
  // dentro do próprio setupLock() (sessão já ativa). Caso contrário, o
  // próprio botão de login chama recarregarTudoPosLogin() ao autenticar —
  // evita ler/gravar dados antes do login terminar (condição de corrida).
  if(USUARIO_LOGADO){
    renderTabsForUser();
  }
})();
